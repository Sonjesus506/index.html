<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>💰 Crypto Tap</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0a08;
            color: #f5e6d3;
            position: fixed;
        }

        /* ===== APP CONTAINER ===== */
        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px 12px 6px;
            overflow: hidden;
            background: linear-gradient(180deg, #1a1410 0%, #0e0a08 40%, #0a0806 100%);
            position: relative;
        }
        .app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 30%, rgba(243, 186, 47, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            padding: 4px 0 6px;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f3ba2f, #d49c1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #0e0c07;
            border: 2px solid rgba(243, 186, 47, 0.3);
            flex-shrink: 0;
        }
        .user-info .name {
            font-size: 16px;
            font-weight: 700;
            color: #f5e6d3;
        }
        .user-info .rank {
            font-size: 11px;
            color: #f3ba2f;
            background: rgba(243, 186, 47, 0.12);
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
        }
        .user-info .energy-bar {
            font-size: 10px;
            color: #8a7a54;
            margin-top: 2px;
        }
        .user-info .energy-bar span {
            color: #f3ba2f;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-btn {
            background: rgba(26, 22, 16, 0.6);
            border: 1px solid rgba(47, 40, 28, 0.3);
            border-radius: 30px;
            padding: 6px 12px;
            color: #f5e6d3;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-btn:active { transform: scale(0.95); }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-bottom: 4px;
        }
        .stat-card {
            background: rgba(26, 22, 16, 0.5);
            border-radius: 12px;
            padding: 6px 8px;
            border: 1px solid rgba(47, 40, 28, 0.15);
            text-align: center;
        }
        .stat-card .num {
            font-size: 20px;
            font-weight: 800;
            color: #f3ba2f;
        }
        .stat-card .label {
            font-size: 7px;
            color: #8a7a54;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== COIN - PREMIUM GOLD ===== */
        .coin-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 1;
            perspective: 800px;
            margin: 4px 0;
        }
        .coin {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 2;
            transform-style: preserve-3d;
        }
        /* Main coin body */
        .coin::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 28%, #fff4b0, #f5c842 30%, #d4a017 55%, #b8860b 75%, #8a6b0e 95%);
            border: 8px solid #f9d342;
            box-shadow:
                0 0 0 4px rgba(107, 79, 14, 0.4),
                0 12px 60px rgba(243, 186, 47, 0.3),
                inset 0 -15px 40px rgba(0,0,0,0.5),
                inset 0 15px 40px rgba(255,215,0,0.15),
                0 0 80px rgba(243, 186, 47, 0.08);
            z-index: 1;
        }
        /* Coin symbol */
        .coin::after {
            content: '₿';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            font-size: 90px;
            font-weight: 900;
            color: #7a5f0e;
            text-shadow: 
                0 2px 4px rgba(255,215,0,0.2),
                0 -2px 4px rgba(0,0,0,0.3),
                0 0 40px rgba(243, 186, 47, 0.1);
            font-family: 'Georgia', serif;
        }
        /* Inner rings */
        .coin .inner-ring {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.15);
            z-index: 1;
            pointer-events: none;
        }
        .coin .inner-ring-2 {
            position: absolute;
            top: 24px;
            left: 24px;
            right: 24px;
            bottom: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255,215,0,0.08);
            z-index: 1;
            pointer-events: none;
        }
        /* Shine effect */
        .coin .shine {
            position: absolute;
            top: 8%;
            left: 12%;
            width: 35%;
            height: 25%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.35) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.6;
        }
        /* Decorative dots */
        .coin .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255,215,0,0.2);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .coin:active { transform: scale(0.85) rotateY(10deg); }
        .coin.disabled { opacity: 0.4; pointer-events: none; }

        /* ===== FLOAT TEXT ===== */
        .float-text {
            position: absolute;
            font-size: 2.2rem;
            font-weight: 800;
            color: #f3ba2f;
            text-shadow: 0 0 20px #f3ba2f, 0 0 40px #f3ba2f80;
            pointer-events: none;
            z-index: 10;
            animation: floatUp 0.9s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-140px) scale(1.3); }
        }

        /* ===== BOTTOM ROW ===== */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }
        .bottom-btn {
            background: rgba(26, 22, 16, 0.6);
            border: 1px solid rgba(47, 40, 28, 0.2);
            border-radius: 12px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .bottom-btn:active { transform: scale(0.95); background: rgba(47, 40, 28, 0.4); }
        .bottom-btn .icon { font-size: 18px; display: block; }
        .bottom-btn .label { font-size: 7px; color: #8a7a54; margin-top: 2px; font-weight: 600; }
        .bottom-btn .time { font-size: 8px; color: #4d3f28; }

        /* ===== NEWS BAR ===== */
        .news-bar {
            background: rgba(26, 22, 16, 0.5);
            border-radius: 10px;
            padding: 6px 12px;
            border: 1px solid rgba(47, 40, 28, 0.15);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .news-bar .news-text {
            font-size: 9px;
            color: #bdaa7a;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .news-bar .news-link {
            font-size: 9px;
            color: #f3ba2f;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, rgba(20, 16, 12, 0.95), rgba(14, 11, 8, 0.95));
            border-radius: 30px;
            padding: 6px 4px;
            border: 1px solid rgba(47, 40, 28, 0.2);
            flex-shrink: 0;
            margin-top: 6px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 8px;
            color: rgba(150, 140, 120, 0.5);
            cursor: pointer;
            background: transparent;
            border: none;
            font-weight: 600;
            gap: 1px;
            transition: 0.15s;
            flex: 1;
            position: relative;
        }
        .nav-item .icon { font-size: 20px; line-height: 1; }
        .nav-item .label { font-size: 7px; text-transform: uppercase; letter-spacing: 0.3px; }
        .nav-item.active { color: #f3ba2f; background: rgba(243, 186, 47, 0.08); }
        .nav-item:active { opacity: 0.6; }
        .nav-item .badge-dot {
            position: absolute;
            top: 2px;
            right: 6px;
            width: 6px;
            height: 6px;
            background: #ff6b6b;
            border-radius: 50%;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: linear-gradient(145deg, #1a1610, #12100d);
            border: 1px solid rgba(61, 50, 31, 0.4);
            border-radius: 24px;
            padding: 20px 18px 18px;
            max-width: 380px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }
        .modal-box .modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 20px;
            color: #8a7a54;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 8px;
        }
        .modal-box .modal-close:active { color: #f3ba2f; }
        .modal-box h2 {
            color: #f3ba2f;
            font-size: 1.2rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .modal-box .modal-body {
            color: #bdaa7a;
            font-size: 13px;
        }
        .modal-box .modal-body .item {
            background: rgba(14, 12, 7, 0.6);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(47, 40, 28, 0.3);
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box .modal-body .item .label { color: #8a7a54; font-size: 12px; }
        .modal-box .modal-body .item .value { color: #f3ba2f; font-weight: 600; font-size: 14px; }
        .modal-box .modal-body .big-btn {
            background: linear-gradient(135deg, #f3ba2f, #d49c1a);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: #0e0c07;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #876a1a;
            transition: 0.08s;
            margin-top: 8px;
        }
        .modal-box .modal-body .big-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #876a1a; }
        .modal-box .modal-body .big-btn.secondary {
            background: rgba(26, 22, 16, 0.8);
            color: #f3ba2f;
            box-shadow: 0 4px 0 #1a1610;
            border: 1px solid rgba(243, 186, 47, 0.2);
        }
        .modal-box .modal-body .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0;
        }
        .modal-box .modal-body .input-group input {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(47, 40, 28, 0.3);
            background: rgba(14, 12, 7, 0.6);
            color: #e5d6b0;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        .modal-box .modal-body .input-group input:focus { border-color: #f3ba2f; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .coin { width: 180px; height: 180px; }
            .coin::after { font-size: 70px; }
            .stats-bar .stat-card .num { font-size: 16px; }
        }
        @media (max-width: 360px) {
            .coin { width: 150px; height: 150px; }
            .coin::after { font-size: 55px; }
            .bottom-row { grid-template-columns: 1fr 1fr; }
        }

        /* Scrollbar */
        .modal-box::-webkit-scrollbar { width: 3px; }
        .modal-box::-webkit-scrollbar-track { background: transparent; }
        .modal-box::-webkit-scrollbar-thumb { background: #3d321f; border-radius: 10px; }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="user-section">
            <div class="avatar" id="avatarDisplay">👤</div>
            <div class="user-info">
                <div class="name" id="userName">CEO</div>
                <div class="rank">🥉 Bronze <span id="rankProgress">1 / 11</span></div>
                <div class="energy-bar">⚡ <span id="energyDisplay">1000</span> / 1000</div>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="openUpgrades()">⬆️ Lv.<span id="levelDisplay">1</span></button>
            <button class="header-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <!-- ===== STATS BAR ===== -->
    <div class="stats-bar">
        <div class="stat-card">
            <div class="num" id="balanceDisplay">0</div>
            <div class="label">💰 Coins</div>
        </div>
        <div class="stat-card">
            <div class="num" id="hourEarnings">0</div>
            <div class="label">⚡ Per Hour</div>
        </div>
        <div class="stat-card">
            <div class="num" id="tapPowerDisplay">1</div>
            <div class="label">👆 Tap Power</div>
        </div>
    </div>

    <!-- ===== COIN ===== -->
    <div class="coin-wrapper" id="coinWrapper">
        <div class="coin" id="mainCoin" role="button" aria-label="Tap to earn">
            <div class="inner-ring"></div>
            <div class="inner-ring-2"></div>
            <div class="shine"></div>
            <div class="dot" style="top:8%;left:20%;"></div>
            <div class="dot" style="top:8%;right:20%;"></div>
            <div class="dot" style="bottom:8%;left:20%;"></div>
            <div class="dot" style="bottom:8%;right:20%;"></div>
            <div class="dot" style="top:50%;left:5%;"></div>
            <div class="dot" style="top:50%;right:5%;"></div>
        </div>
    </div>

    <!-- ===== BOTTOM ROW ===== -->
    <div class="bottom-row">
        <div class="bottom-btn" onclick="openDailyReward()">
            <span class="icon">🎁</span>
            <span class="label">Daily reward</span>
            <span class="time" id="dailyRewardTime">--:--</span>
        </div>
        <div class="bottom-btn" onclick="openCipher()">
            <span class="icon">🔐</span>
            <span class="label">Daily cipher</span>
            <span class="time" id="cipherTime">--:--</span>
        </div>
        <div class="bottom-btn" onclick="openCombo()">
            <span class="icon">🎯</span>
            <span class="label">Daily combo</span>
            <span class="time" id="comboTime">--:--</span>
        </div>
        <div class="bottom-btn" onclick="openMiniGame()">
            <span class="icon">🎮</span>
            <span class="label">Mini game</span>
            <span class="time" id="miniGameTime">--:--</span>
        </div>
    </div>

    <!-- ===== NEWS ===== -->
    <div class="news-bar">
        <span class="news-text" id="newsText">💰 Crypto market update: New airdrop coming soon!</span>
        <span class="news-link" onclick="openNews()">Visit ></span>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="nav-item active" data-page="home" onclick="switchPage('home')">
            <span class="icon">🏠</span>
            <span class="label">Home</span>
        </button>
        <button class="nav-item" data-page="search" onclick="switchPage('search')">
            <span class="icon">🔍</span>
            <span class="label">Search</span>
        </button>
        <button class="nav-item" data-page="notifications" onclick="switchPage('notifications')">
            <span class="icon">🔔</span>
            <span class="label">Notifications</span>
            <span class="badge-dot"></span>
        </button>
        <button class="nav-item" data-page="activity" onclick="switchPage('activity')">
            <span class="icon">📊</span>
            <span class="label">Activity</span>
        </button>
    </div>

</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2 id="modalTitle">Modal</h2>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
(function() {
    "use strict";

    // ===== STATE =====
    const STORAGE_KEY = 'crypto_tap_data_v2';
    const MAX_ENERGY = 1000;
    const ENERGY_REGEN = 1;

    let saved = (() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) { return null; }
    })();

    let balance = saved?.balance || 0;
    let energy = saved?.energy ?? MAX_ENERGY;
    let level = saved?.level || 1;
    let tapPower = saved?.tapPower || 1;
    let lastTapTime = saved?.lastTapTime || 0;
    let userName = saved?.userName || 'CEO';
    let dailyRewardClaimed = saved?.dailyRewardClaimed || false;
    let dailyRewardDate = saved?.dailyRewardDate || '';
    let comboClaimed = saved?.comboClaimed || false;
    let comboDate = saved?.comboDate || '';
    let cipherSolved = saved?.cipherSolved || false;
    let cipherDate = saved?.cipherDate || '';
    let miniGameScore = saved?.miniGameScore || 0;
    let activityLog = saved?.activityLog || ['🎮 Started playing!'];
    let notifications = saved?.notifications || [];
    let comboAttempts = saved?.comboAttempts || 0;
    let comboAnswer = saved?.comboAnswer || 0;

    // ===== DOM =====
    const balanceDisplay = document.getElementById('balanceDisplay');
    const energyDisplay = document.getElementById('energyDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const tapPowerDisplay = document.getElementById('tapPowerDisplay');
    const hourEarnings = document.getElementById('hourEarnings');
    const rankProgress = document.getElementById('rankProgress');
    const userNameDisplay = document.getElementById('userName');
    const coinEl = document.getElementById('mainCoin');
    const coinWrapper = document.getElementById('coinWrapper');
    const dailyRewardTime = document.getElementById('dailyRewardTime');
    const cipherTime = document.getElementById('cipherTime');
    const comboTime = document.getElementById('comboTime');
    const miniGameTime = document.getElementById('miniGameTime');
    const newsText = document.getElementById('newsText');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    // ===== FUNCTIONS =====
    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            balance, energy, level, tapPower, lastTapTime, userName,
            dailyRewardClaimed, dailyRewardDate,
            comboClaimed, comboDate,
            cipherSolved, cipherDate,
            miniGameScore, activityLog, notifications,
            comboAttempts, comboAnswer
        }));
    }

    function updateUI() {
        balanceDisplay.textContent = balance.toLocaleString();
        energyDisplay.textContent = Math.floor(energy);
        levelDisplay.textContent = level;
        tapPowerDisplay.textContent = tapPower;
        rankProgress.textContent = `${Math.min(level, 11)} / 11`;
        hourEarnings.textContent = (tapPower * 3600 / 2).toFixed(0);
        userNameDisplay.textContent = userName;

        if (energy <= 0) coinEl.classList.add('disabled');
        else coinEl.classList.remove('disabled');

        updateCountdowns();
        saveState();
    }

    function updateCountdowns() {
        const now = new Date();
        const times = [
            { el: dailyRewardTime, target: 0, min: 0 },
            { el: cipherTime, target: 6, min: 15 },
            { el: comboTime, target: 23, min: 15 },
            { el: miniGameTime, target: 7, min: 15 }
        ];
        times.forEach(({ el, target, min }) => {
            let targetDate = new Date(now);
            targetDate.setHours(target, min, 0, 0);
            if (targetDate < now) targetDate.setDate(targetDate.getDate() + 1);
            const diff = targetDate - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        });
    }

    // ===== ENERGY REGEN =====
    function regenerateEnergy() {
        const now = Date.now();
        const diff = (now - lastTapTime) / 1000;
        const regen = diff * ENERGY_REGEN;
        if (regen > 0 && energy < MAX_ENERGY) {
            energy = Math.min(MAX_ENERGY, energy + regen);
            lastTapTime = now - (diff % 1 * 1000);
            updateUI();
        }
    }

    setInterval(() => {
        regenerateEnergy();
        updateCountdowns();
    }, 1000);

    // ===== TAP =====
    function handleTap(e) {
        e.preventDefault?.();
        regenerateEnergy();

        if (energy <= 0) {
            showTapLimit();
            return;
        }

        const amount = tapPower;
        energy -= 1;
        balance += amount;
        lastTapTime = Date.now();

        // Level up every 1000 coins
        const newLevel = Math.floor(balance / 1000) + 1;
        if (newLevel > level) {
            level = newLevel;
            addActivity(`🏆 Leveled up to ${level}!`);
            if (level % 5 === 0) {
                addNotification(`🎉 You reached level ${level}! Amazing!`);
            }
        }

        updateUI();

        // Float text
        const wrapperRect = coinWrapper.getBoundingClientRect();
        const x = (e.clientX || window.innerWidth/2) - wrapperRect.left;
        const y = (e.clientY || wrapperRect.top + 50) - wrapperRect.top;
        createFloatText(x, y, amount);

        // Animation
        coinEl.style.transform = 'scale(0.85) rotateY(8deg)';
        setTimeout(() => coinEl.style.transform = '', 80);
    }

    function showTapLimit() {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = '⏳ No energy!';
        el.style.left = (coinWrapper.offsetWidth/2 - 40) + 'px';
        el.style.top = '20px';
        coinWrapper.appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    function createFloatText(x, y, amount) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = `+${amount}`;
        el.style.left = (x - 15) + 'px';
        el.style.top = (y - 10) + 'px';
        coinWrapper.appendChild(el);
        setTimeout(() => el.remove(), 900);
    }

    // ===== COIN EVENTS =====
    coinEl.addEventListener('click', handleTap);
    coinEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleTap(e);
    }, { passive: false });

    // ===== HELPER FUNCTIONS =====
    function addActivity(msg) {
        activityLog.unshift(`${new Date().toLocaleTimeString()} ${msg}`);
        if (activityLog.length > 50) activityLog.pop();
        saveState();
    }

    function addNotification(msg) {
        notifications.unshift({ msg, time: new Date().toLocaleString(), read: false });
        if (notifications.length > 30) notifications.pop();
        saveState();
    }

    // ===== MODAL =====
    function openModal(title, html) {
        modalTitle.textContent = title;
        modalBody.innerHTML = html;
        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
    }
    window.closeModal = closeModal;

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
    });

    // ===== DAILY REWARD =====
    function openDailyReward() {
        const today = new Date().toDateString();
        const claimed = dailyRewardDate === today && dailyRewardClaimed;
        const reward = 100 + level * 10;

        openModal('🎁 Daily Reward', `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:4rem;">🎁</div>
                <div style="font-size:2rem;font-weight:800;color:#f3ba2f;">+${reward} coins</div>
                <div style="font-size:11px;color:#8a7a54;">Claim once per day</div>
                ${claimed ? `
                    <div style="background:rgba(47,40,28,0.3);padding:12px;border-radius:14px;margin:10px 0;">
                        ✅ Already claimed today!<br>
                        <span style="font-size:10px;color:#8a7a54;">Next reward in 24h</span>
                    </div>
                ` : `
                    <button class="big-btn" onclick="claimDailyReward()">🎯 Claim Now</button>
                `}
            </div>
        `);
    }
    window.openDailyReward = openDailyReward;

    function claimDailyReward() {
        const reward = 100 + level * 10;
        balance += reward;
        dailyRewardClaimed = true;
        dailyRewardDate = new Date().toDateString();
        addActivity(`🎁 Claimed daily reward: +${reward} coins`);
        updateUI();
        closeModal();
        openDailyReward();
    }
    window.claimDailyReward = claimDailyReward;

    // ===== DAILY CIPHER =====
    function openCipher() {
        const today = new Date().toDateString();
        const solved = cipherDate === today && cipherSolved;
        const code = Math.floor(1000 + Math.random() * 9000);

        openModal('🔐 Daily Cipher', `
            <div style="text-align:center;padding:6px 0;">
                <div style="font-size:3rem;">🔐</div>
                <div style="font-size:14px;color:#bdaa7a;margin:6px 0;">Enter the daily cipher code:</div>
                <div style="font-size:2.5rem;font-weight:800;color:#f3ba2f;background:rgba(14,12,7,0.6);padding:12px;border-radius:16px;border:1px solid rgba(47,40,28,0.3);">
                    ${code}
                </div>
                ${solved ? `
                    <div style="background:rgba(47,40,28,0.3);padding:12px;border-radius:14px;margin:10px 0;color:#4caf50;">
                        ✅ Solved today! +500 coins
                    </div>
                ` : `
                    <div class="input-group" style="margin-top:10px;">
                        <input type="text" id="cipherInput" placeholder="Enter code..." inputmode="numeric" />
                        <button class="big-btn" onclick="solveCipher(${code})">🔓 Unlock</button>
                    </div>
                `}
            </div>
        `);
        setTimeout(() => {
            const inp = document.getElementById('cipherInput');
            if (inp) inp.focus();
        }, 300);
    }
    window.openCipher = openCipher;

    function solveCipher(code) {
        const input = document.getElementById('cipherInput');
        if (!input) return;
        if (input.value.trim() === String(code)) {
            balance += 500;
            cipherSolved = true;
            cipherDate = new Date().toDateString();
            addActivity('🔐 Solved daily cipher: +500 coins');
            updateUI();
            closeModal();
            alert('✅ Correct! +500 coins!');
        } else {
            alert('❌ Wrong code. Try again!');
            openCipher();
        }
    }
    window.solveCipher = solveCipher;

    // ===== DAILY COMBO =====
    const comboEmojis = ['🎯', '⭐', '💎'];
    const MAX_COMBO_ATTEMPTS = 3;

    function openCombo() {
        const today = new Date().toDateString();
        const claimed = comboDate === today && comboClaimed;

        let attemptsHTML = '';
        for (let i = 0; i < MAX_COMBO_ATTEMPTS; i++) {
            const cls = i < comboAttempts ? 'used' : 'remaining';
            attemptsHTML += `<div class="dot ${cls}" style="display:inline-block;width:12px;height:12px;border-radius:50%;margin:2px;background:${i < comboAttempts ? '#ff6b6b' : '#f3ba2f'};border:1px solid rgba(47,40,28,0.3);"></div>`;
        }

        openModal('🎯 Daily Combo', `
            <div style="text-align:center;padding:6px 0;">
                <div style="font-size:3rem;">🎯</div>
                <div style="font-size:14px;color:#bdaa7a;margin:6px 0;">Pick the winning combo!</div>
                ${claimed ? `
                    <div style="background:rgba(47,40,28,0.3);padding:12px;border-radius:14px;margin:10px 0;color:#4caf50;">
                        ✅ Combo claimed! +1000 coins
                    </div>
                ` : `
                    <div style="display:flex;gap:8px;justify-content:center;margin:10px 0;">
                        ${comboEmojis.map((e, i) => `
                            <button class="big-btn secondary" onclick="selectCombo(${i})" style="flex:1;min-width:60px;padding:10px;font-size:20px;">
                                ${e}
                            </button>
                        `).join('')}
                    </div>
                    <div style="font-size:10px;color:#8a7a54;">Attempts: ${attemptsHTML}</div>
                    <div style="font-size:10px;color:#4d3f28;margin-top:4px;">${MAX_COMBO_ATTEMPTS - comboAttempts} attempts remaining</div>
                `}
            </div>
        `);
    }
    window.openCombo = openCombo;

    function selectCombo(index) {
        if (comboAttempts >= MAX_COMBO_ATTEMPTS) {
            alert('❌ You used all attempts! Try again tomorrow.');
            return;
        }
        
        // Random correct answer (changes daily)
        const correctAnswer = Math.floor(Math.random() * 3);
        
        comboAttempts++;
        if (index === correctAnswer) {
            balance += 1000;
            comboClaimed = true;
            comboDate = new Date().toDateString();
            addActivity('🎯 Won daily combo: +1000 coins');
            updateUI();
            closeModal();
            alert('🎉 Correct! +1000 coins!');
        } else {
            const left = MAX_COMBO_ATTEMPTS - comboAttempts;
            alert(`❌ Wrong! ${left} attempts left.`);
            if (left > 0) openCombo();
            else {
                closeModal();
                alert('No more attempts. Try again tomorrow!');
            }
        }
    }
    window.selectCombo = selectCombo;

    // ===== MINI GAME =====
    function openMiniGame() {
        openModal('🎮 Mini Game', `
            <div style="text-align:center;padding:6px 0;">
                <div style="font-size:3rem;">🎮</div>
                <div style="font-size:14px;color:#bdaa7a;margin:6px 0;">Tap the button as fast as you can!</div>
                <div style="font-size:3rem;font-weight:800;color:#f3ba2f;" id="miniGameScore">${miniGameScore}</div>
                <div style="font-size:11px;color:#8a7a54;">Your best score</div>
                <button class="big-btn" onclick="startMiniGame()" style="margin-top:10px;">▶️ Play</button>
            </div>
        `);
    }
    window.openMiniGame = openMiniGame;

    let miniGameRunning = false;
    let miniGameTaps = 0;
    let miniGameTimer = null;

    function startMiniGame() {
        if (miniGameRunning) return;
        miniGameRunning = true;
        miniGameTaps = 0;
        let timeLeft = 10;

        openModal('🎮 Mini Game', `
            <div style="text-align:center;">
                <div style="font-size:4rem;cursor:pointer;display:inline-block;padding:20px;border-radius:50%;background:rgba(243,186,47,0.1);border:2px solid rgba(243,186,47,0.2);" id="miniGameHamster" onclick="tapMiniGame()">🪙</div>
                <div style="font-size:2rem;font-weight:800;color:#f3ba2f;margin:6px 0;" id="miniGameCounter">0</div>
                <div style="font-size:14px;color:#bdaa7a;">⏱️ <span id="miniGameTimer">10</span>s</div>
                <div style="font-size:10px;color:#8a7a54;">Tap the coin!</div>
            </div>
        `);

        miniGameTimer = setInterval(() => {
            timeLeft--;
            const timerEl = document.getElementById('miniGameTimer');
            if (timerEl) timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(miniGameTimer);
                miniGameRunning = false;
                if (miniGameTaps > miniGameScore) {
                    miniGameScore = miniGameTaps;
                    saveState();
                    addActivity(`🎮 New mini game record: ${miniGameTaps} taps!`);
                    alert(`🏆 New record! ${miniGameTaps} taps!`);
                } else {
                    alert(`⏱️ Time up! ${miniGameTaps} taps.`);
                }
                closeModal();
                openMiniGame();
            }
        }, 1000);
    }
    window.startMiniGame = startMiniGame;

    function tapMiniGame() {
        if (!miniGameRunning) return;
        miniGameTaps++;
        const counter = document.getElementById('miniGameCounter');
        if (counter) counter.textContent = miniGameTaps;
        const coin = document.getElementById('miniGameHamster');
        if (coin) {
            coin.style.transform = 'scale(0.8)';
            setTimeout(() => coin.style.transform = '', 100);
        }
    }
    window.tapMiniGame = tapMiniGame;

    // ===== UPGRADES =====
    function openUpgrades() {
        const upgradeCost = 100 * Math.pow(2, tapPower - 1);
        
        openModal('⬆️ Upgrades', `
            <div style="padding:6px 0;">
                <div class="item">
                    <span class="label">Current Tap Power</span>
                    <span class="value">+${tapPower}</span>
                </div>
                <div class="item">
                    <span class="label">Next Level</span>
                    <span class="value">+${tapPower + 1}</span>
                </div>
                <div class="item">
                    <span class="label">Upgrade Cost</span>
                    <span class="value">${upgradeCost.toLocaleString()} coins</span>
                </div>
                <button class="big-btn" onclick="upgradeTap()" ${balance < upgradeCost ? 'disabled style="opacity:0.4;"' : ''}>
                    ${balance < upgradeCost ? '❌ Not enough coins' : '⬆️ Upgrade'}
                </button>
                <div style="margin-top:10px;border-top:1px solid rgba(47,40,28,0.2);padding-top:10px;">
                    <div class="item">
                        <span class="label">⚡ Energy</span>
                        <span class="value">${Math.floor(energy)} / ${MAX_ENERGY}</span>
                    </div>
                    <div class="item">
                        <span class="label">🏆 Level</span>
                        <span class="value">${level}</span>
                    </div>
                    <div class="item">
                        <span class="label">💰 Total Coins</span>
                        <span class="value">${balance.toLocaleString()}</span>
                    </div>
                </div>
            </div>
        `);
    }
    window.openUpgrades = openUpgrades;

    function upgradeTap() {
        const cost = 100 * Math.pow(2, tapPower - 1);
        if (balance < cost) {
            alert('❌ Not enough coins!');
            return;
        }
        balance -= cost;
        tapPower += 1;
        addActivity(`⬆️ Upgraded tap power to +${tapPower}`);
        updateUI();
        closeModal();
        openUpgrades();
    }
    window.upgradeTap = upgradeTap;

    // ===== NEWS =====
    function openNews() {
        openModal('📰 News', `
            <div style="padding:6px 0;">
                <div style="background:rgba(14,12,7,0.6);padding:12px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);margin:4px 0;">
                    <div style="font-size:14px;font-weight:600;color:#f5e6d3;">💰 New Airdrop Event!</div>
                    <div style="font-size:11px;color:#8a7a54;margin-top:6px;">Connect your wallet to participate in the upcoming airdrop. 10,000 coins reward!</div>
                </div>
                <div style="background:rgba(14,12,7,0.6);padding:12px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);margin:4px 0;">
                    <div style="font-size:14px;font-weight:600;color:#f5e6d3;">🎉 Season 2 Coming Soon!</div>
                    <div style="font-size:11px;color:#8a7a54;margin-top:6px;">New features, more rewards, and exclusive skins!</div>
                </div>
                <div style="background:rgba(14,12,7,0.6);padding:12px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);margin:4px 0;">
                    <div style="font-size:14px;font-weight:600;color:#f5e6d3;">🚀 Tap Power Update</div>
                    <div style="font-size:11px;color:#8a7a54;margin-top:6px;">Upgrade your tap power to earn more coins per tap!</div>
                </div>
            </div>
        `);
    }
    window.openNews = openNews;

    // ===== SETTINGS =====
    function openSettings() {
        openModal('⚙️ Settings', `
            <div style="padding:6px 0;">
                <div class="item">
                    <span class="label">👤 Username</span>
                    <span class="value" id="settingsUsername">${userName}</span>
                </div>
                <div class="input-group" style="margin-top:6px;">
                    <input type="text" id="usernameInput" placeholder="Change username..." value="${userName}" />
                    <button class="big-btn" onclick="changeUsername()">✏️ Update</button>
                </div>
                <div style="height:10px;"></div>
                <div class="item">
                    <span class="label">💰 Balance</span>
                    <span class="value">${balance.toLocaleString()}</span>
                </div>
                <div class="item">
                    <span class="label">🏆 Level</span>
                    <span class="value">${level}</span>
                </div>
                <div class="item">
                    <span class="label">👆 Tap Power</span>
                    <span class="value">+${tapPower}</span>
                </div>
                <button class="big-btn secondary" onclick="resetGame()" style="margin-top:10px;color:#ff6b6b;">🔄 Reset Game</button>
            </div>
        `);
    }
    window.openSettings = openSettings;

    function changeUsername() {
        const input = document.getElementById('usernameInput');
        if (!input) return;
        const name = input.value.trim();
        if (!name) {
            alert('Please enter a username.');
            return;
        }
        userName = name;
        addActivity(`✏️ Changed username to ${userName}`);
        updateUI();
        closeModal();
        openSettings();
    }
    window.changeUsername = changeUsername;

    function resetGame() {
        if (confirm('⚠️ Are you sure? This will delete all progress!')) {
            if (confirm('Really? All coins, levels, and upgrades will be lost!')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
    }
    window.resetGame = resetGame;

    // ===== PAGE SWITCHING =====
    function switchPage(page) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const btn = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (btn) btn.classList.add('active');

        if (page === 'notifications') {
            openModal('🔔 Notifications', `
                <div style="padding:4px 0;">
                    ${notifications.length === 0 ? '<p style="color:#8a7a54;text-align:center;">No notifications</p>' :
                    notifications.map(n => `
                        <div style="background:rgba(14,12,7,0.6);padding:10px 14px;border-radius:10px;border:1px solid rgba(47,40,28,0.2);margin:4px 0;">
                            <div style="font-size:13px;color:#f5e6d3;">${n.msg}</div>
                            <div style="font-size:9px;color:#4d3f28;">${n.time}</div>
                        </div>
                    `).join('')}
                </div>
            `);
            notifications.forEach(n => n.read = true);
            saveState();
        } else if (page === 'activity') {
            openModal('📊 Activity', `
                <div style="padding:4px 0;">
                    ${activityLog.length === 0 ? '<p style="color:#8a7a54;text-align:center;">No activity yet</p>' :
                    activityLog.map(a => `
                        <div style="background:rgba(14,12,7,0.6);padding:8px 12px;border-radius:8px;border:1px solid rgba(47,40,28,0.15);margin:3px 0;font-size:12px;color:#bdaa7a;">
                            ${a}
                        </div>
                    `).join('')}
                </div>
            `);
        } else if (page === 'search') {
            openModal('🔍 Search', `
                <div style="padding:6px 0;text-align:center;">
                    <div style="font-size:3rem;">🔍</div>
                    <p style="color:#8a7a54;margin:6px 0;">Search for players and more</p>
                    <div class="input-group">
                        <input type="text" placeholder="Search..." />
                        <button class="big-btn secondary">Search</button>
                    </div>
                </div>
            `);
        }
    }
    window.switchPage = switchPage;

    // ===== INIT =====
    updateUI();

    if (!saved) {
        addNotification('💰 Welcome to Crypto Tap!');
        addActivity('🎮 Started playing!');
    }

    console.log('💰 Crypto Tap loaded!');
    console.log('👤 User:', userName);
    console.log('💵 Balance:', balance);
    console.log('⚡ Energy:', energy);
    console.log('🏆 Level:', level);
    console.log('👆 Tap Power:', tapPower);
})();
</script>
</body>
</html>
