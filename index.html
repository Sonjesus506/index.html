<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>⛓️ Web3 Crypto Miner</title>
  <style>
    /* ----- global reset & dark futuristic theme ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0a0f17;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .miner-container {
      max-width: 460px;
      width: 100%;
      background: #101a26;
      background: radial-gradient(circle at 30% 10%, #15222f, #0b131d);
      border-radius: 48px 48px 32px 32px;
      padding: 28px 18px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 200, 0.06) inset;
      border: 1px solid rgba(0, 255, 200, 0.04);
      transition: all 0.2s;
    }

    /* ----- typography & accents ----- */
    .glow-cyan {
      color: #b0f0ff;
      text-shadow: 0 0 12px rgba(0, 220, 255, 0.3);
    }

    .text-green {
      color: #5ce0a0;
    }

    .text-gold {
      background: linear-gradient(135deg, #f7e05e, #f9b84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .label-muted {
      color: #6f8ba8;
      font-weight: 500;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ----- header stats ----- */
    .header-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 18, 28, 0.5);
      backdrop-filter: blur(6px);
      border-radius: 60px;
      padding: 8px 16px 8px 20px;
      border: 1px solid #1e3347;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-item .value {
      font-weight: 700;
      font-size: 1.1rem;
      color: #e2f0ff;
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .stat-item .value.gold {
      background: linear-gradient(135deg, #f7e05e, #f9b84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-divider {
      width: 1px;
      height: 28px;
      background: #28445a;
    }

    /* ----- balance big ----- */
    .balance-display {
      text-align: center;
      margin: 6px 0 12px;
    }

    .balance-display .coin {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f7e05e, #f9b84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
      line-height: 1.1;
    }

    .balance-display .label {
      font-size: 0.7rem;
      color: #6f8ba8;
      letter-spacing: 0.1em;
    }

    /* ----- status pill ----- */
    .status-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #0e1a24;
      padding: 8px 16px;
      border-radius: 60px;
      margin: 10px 0 18px;
      border: 1px solid #2a4054;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #3d5a6e;
      transition: 0.2s;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
    }

    .dot.active {
      background: #3fe07a;
      box-shadow: 0 0 20px #3fe07a;
    }

    .status-label {
      font-weight: 600;
      color: #b8d4ec;
    }

    /* ----- buttons ----- */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 12px;
      border: none;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.05rem;
      background: #1d2f3f;
      color: #d4e6fa;
      box-shadow: 0 6px 0 #0a141e, 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: all 0.07s ease;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
      cursor: pointer;
      border: 1px solid #365066;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0a141e;
    }

    .btn-primary {
      background: linear-gradient(145deg, #1e7bff, #0f4fbb);
      color: white;
      border: 1px solid #6bb0ff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .btn-success {
      background: linear-gradient(145deg, #2fb86a, #167a42);
      color: white;
      border: 1px solid #6ae09a;
    }

    .btn-warning {
      background: linear-gradient(145deg, #e6b84c, #c48f2b);
      color: #0d141e;
      border: 1px solid #f7d97a;
      font-weight: 800;
    }

    .btn:disabled {
      opacity: 0.5;
      transform: translateY(2px);
      box-shadow: 0 3px 0 #0a141e;
      pointer-events: none;
    }

    /* ----- boost card ----- */
    .boost-card {
      background: rgba(0, 20, 35, 0.5);
      backdrop-filter: blur(4px);
      border-radius: 40px;
      padding: 14px 18px;
      margin: 6px 0 16px;
      border: 1px solid #2b4a60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .boost-info .title {
      font-weight: 600;
      color: #c0defa;
      font-size: 0.9rem;
    }

    .boost-info .price {
      font-size: 0.85rem;
      font-weight: 600;
      color: #f7d46a;
    }

    .btn-boost {
      background: #1d3547;
      border: 1px solid #4f7a9a;
      color: #e0f0ff;
      padding: 8px 22px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 0 #0d1a24;
      transition: 0.06s linear;
      cursor: pointer;
    }

    .btn-boost:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0d1a24;
    }

    /* ----- withdrawal card ----- */
    .withdraw-card {
      background: rgba(8, 22, 34, 0.6);
      backdrop-filter: blur(4px);
      border-radius: 32px;
      padding: 18px 16px 20px;
      margin-top: 20px;
      border: 1px solid #1e3b50;
    }

    .withdraw-card .title {
      color: #b0d4f0;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.7rem;
      color: #7d9bb8;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .form-group select, 
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0d1b28;
      border: 1px solid #2a4a62;
      border-radius: 40px;
      color: #d6edff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.15s;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #4aa0e0;
      box-shadow: 0 0 12px rgba(0, 160, 255, 0.2);
    }

    .form-group select option {
      background: #0d1b28;
    }

    .btn-withdraw {
      background: linear-gradient(145deg, #00b894, #00876a);
      border: 1px solid #4ae0b0;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      margin-top: 6px;
    }

    .btn-withdraw:active {
      background: #00876a;
    }

    /* ----- toast / alert (user-friendly) ----- */
    .toast-message {
      background: #1f2c3a;
      border-left: 6px solid #f7b84a;
      color: #f0f7ff;
      padding: 14px 20px;
      border-radius: 60px;
      font-weight: 500;
      margin: 12px 0 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #4b647a;
      text-align: center;
      font-size: 0.9rem;
    }

    .toast-success {
      border-left-color: #4ae09a;
    }

    /* ----- responsive ----- */
    @media (max-width: 420px) {
      .miner-container { padding: 18px 12px 24px; }
      .balance-display .coin { font-size: 2.4rem; }
      .header-stats { padding: 6px 12px; }
      .stat-item .value { font-size: 0.95rem; }
    }

    .flex { display: flex; }
    .gap-1 { gap: 6px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .mt-1 { margin-top: 8px; }
    .mb-1 { margin-bottom: 8px; }
  </style>
</head>
<body>
<div class="miner-container" id="app">

  <!-- header stats -->
  <div class="header-stats">
    <div class="stat-item">
      <span class="label-muted">⚡ Speed</span>
      <span class="value gold" id="speedDisplay">0.0000</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="label-muted">⏳ Mined</span>
      <span class="value" id="minedDisplay">0.0000</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="label-muted">Status</span>
      <span class="value" id="statusText" style="font-size:0.8rem; color:#8ab4d0;">Idle</span>
    </div>
  </div>

  <!-- balance -->
  <div class="balance-display">
    <div class="label">💰 TOTAL BALANCE</div>
    <div class="coin" id="balanceDisplay">0.0000</div>
  </div>

  <!-- status dot -->
  <div class="status-pill">
    <span class="dot" id="statusDot"></span>
    <span class="status-label" id="statusLabel">⏸️ Mining Stopped</span>
    <span style="margin-left: auto; color: #62859e; font-size: 0.75rem;" id="sessionTime">00:00</span>
  </div>

  <!-- start/stop -->
  <button class="btn btn-primary" id="toggleMineBtn">
    <span>▶</span> START MINING
  </button>

  <!-- boost card -->
  <div class="boost-card">
    <div class="boost-info">
      <span class="title">🚀 Upgrade Speed</span>
      <span class="price" id="boostCostDisplay">💰 100 COINS</span>
      <span style="font-size:0.65rem; color:#6e95b0;">+0.0005 coins/sec</span>
    </div>
    <button class="btn-boost" id="boostBtn">⬆ BOOST</button>
  </div>

  <!-- withdrawal card -->
  <div class="withdraw-card">
    <div class="title">💸 Instant Withdrawal</div>
    <div class="form-group">
      <label>Payment Method</label>
      <select id="paymentMethod">
        <option value="mpesa">Vodacom M-Pesa / Tigo Pesa</option>
        <option value="solana">Solana Wallet (SOL)</option>
        <option value="usdt">USDT (TRC20)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Phone / Wallet Address</label>
      <input type="text" id="walletInput" placeholder="e.g. 0712345678 or 0x...">
    </div>
    <div class="form-group">
      <label>Amount (min 100 coins)</label>
      <input type="number" id="withdrawAmount" placeholder="100" min="100" step="1">
    </div>
    <button class="btn btn-withdraw" id="withdrawBtn">⚡ Submit Withdrawal</button>
  </div>

  <!-- toast container -->
  <div id="toastContainer" class="w-full" style="min-height: 48px; margin-top: 6px;"></div>

  <!-- footer -->
  <div style="margin-top:16px; font-size:0.6rem; color:#2b4b62; text-align:center; border-top:1px solid #1a3142; padding-top:14px;">
    <span>⛓️ simulated · no real resources · web3 demo</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ----- state -----
    let balance = 0.0;
    let miningSpeed = 0.0005;          // base coins/sec
    let totalMined = 0.0;
    let isMining = false;
    let miningInterval = null;
    let sessionInterval = null;
    let sessionSeconds = 0;

    // boost cost
    let boostCost = 100;
    const BOOST_INCREMENT = 0.0005;

    // DOM refs
    const balanceDisplay = document.getElementById('balanceDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const minedDisplay = document.getElementById('minedDisplay');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const statusText = document.getElementById('statusText');
    const sessionTime = document.getElementById('sessionTime');
    const toggleBtn = document.getElementById('toggleMineBtn');
    const boostBtn = document.getElementById('boostBtn');
    const boostCostDisplay = document.getElementById('boostCostDisplay');
    const toastContainer = document.getElementById('toastContainer');

    // withdrawal elements
    const paymentMethod = document.getElementById('paymentMethod');
    const walletInput = document.getElementById('walletInput');
    const withdrawAmount = document.getElementById('withdrawAmount');
    const withdrawBtn = document.getElementById('withdrawBtn');

    // ----- helpers -----
    function fmt(v) { return Number(v).toFixed(4); }

    // ----- refresh UI (all displays) -----
    function refreshUI() {
      balanceDisplay.textContent = fmt(balance);
      speedDisplay.textContent = fmt(miningSpeed);
      minedDisplay.textContent = fmt(totalMined);
      boostCostDisplay.textContent = `💰 ${boostCost} COINS`;
      // status text in header (already updated via setter)
    }

    // ----- toast system (user-friendly alert) -----
    function showToast(msg, isSuccess = false) {
      toastContainer.innerHTML = `<div class="toast-message ${isSuccess ? 'toast-success' : ''}">${msg}</div>`;
      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => {
        toastContainer.innerHTML = '';
      }, 5000);
    }

    // ----- mining tick (per second) -----
    function mineTick() {
      if (!isMining) return;
      balance += miningSpeed;
      totalMined += miningSpeed;
      refreshUI();
    }

    // ----- start / stop mining -----
    function toggleMining() {
      if (isMining) {
        // stop
        isMining = false;
        if (miningInterval) { clearInterval(miningInterval); miningInterval = null; }
        if (sessionInterval) { clearInterval(sessionInterval); sessionInterval = null; }
        statusDot.classList.remove('active');
        statusLabel.textContent = '⏸️ Mining Stopped';
        statusText.textContent = 'Idle';
        toggleBtn.innerHTML = '<span>▶</span> START MINING';
        toggleBtn.className = 'btn btn-primary';
      } else {
        // start
        isMining = true;
        sessionSeconds = 0;
        sessionTime.textContent = '00:00';

        miningInterval = setInterval(mineTick, 1000);
        sessionInterval = setInterval(() => {
          sessionSeconds++;
          const m = String(Math.floor(sessionSeconds / 60)).padStart(2, '0');
          const s = String(sessionSeconds % 60).padStart(2, '0');
          sessionTime.textContent = `${m}:${s}`;
        }, 1000);

        statusDot.classList.add('active');
        statusLabel.textContent = '⛏️ Mining...';
        statusText.textContent = 'Active';
        toggleBtn.innerHTML = '<span>⏹</span> STOP MINING';
        toggleBtn.className = 'btn btn-success';
        showToast('⛏️ Mining started!', true);
      }
      refreshUI();
    }

    // ----- boost speed -----
    function handleBoost() {
      if (balance < boostCost) {
        showToast(`❌ Insufficient balance! Need ${boostCost} coins.`);
        return;
      }
      balance -= boostCost;
      miningSpeed += BOOST_INCREMENT;
      boostCost = Math.floor(boostCost * 1.35);
      if (boostCost < 100) boostCost = 100;
      refreshUI();
      showToast(`🚀 Speed +${BOOST_INCREMENT} coins/sec!`, true);
    }

    // ----- withdrawal logic -----
    function handleWithdrawal() {
      const method = paymentMethod.value;
      const wallet = walletInput.value.trim();
      const amountRaw = parseFloat(withdrawAmount.value);

      if (!wallet) {
        showToast('❌ Please enter a phone number or wallet address.');
        return;
      }
      if (isNaN(amountRaw) || amountRaw < 100) {
        showToast('❌ Minimum withdrawal is 100 coins.');
        return;
      }
      if (amountRaw > balance) {
        showToast(`❌ Insufficient balance! You have ${fmt(balance)} coins.`);
        return;
      }

      // deduct coins
      balance -= amountRaw;
      refreshUI();

      // show instant confirmation
      let methodName = 'M-Pesa';
      if (method === 'solana') methodName = 'Solana';
      else if (method === 'usdt') methodName = 'USDT (TRC20)';

      showToast(`✅ Withdrawal of ${amountRaw} coins via ${methodName} to ${wallet} submitted!`, true);

      // clear fields (optional)
      walletInput.value = '';
      withdrawAmount.value = '';
    }

    // ----- event listeners -----
    toggleBtn.addEventListener('click', toggleMining);
    boostBtn.addEventListener('click', handleBoost);
    withdrawBtn.addEventListener('click', handleWithdrawal);

    // ----- initial render -----
    refreshUI();
    statusDot.classList.remove('active');
    statusLabel.textContent = '⏸️ Mining Stopped';
    statusText.textContent = 'Idle';
    sessionTime.textContent = '00:00';

    // intro toast
    setTimeout(() => {
      showToast('⚡ Start mining & withdraw your coins!', true);
    }, 400);

    // ----- cleanup on page unload -----
    window.addEventListener('beforeunload', function() {
      if (miningInterval) clearInterval(miningInterval);
      if (sessionInterval) clearInterval(sessionInterval);
    });

  })();
</script>
</body>
</html>
