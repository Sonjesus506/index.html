<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🐹 Hamster Kombat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0a08;
            color: #f5e6d3;
            position: fixed;
        }
        .app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px 12px 6px;
            overflow: hidden;
            background: linear-gradient(180deg, #1a1410 0%, #0e0a08 40%, #0a0806 100%);
            position: relative;
        }
        /* Background glow */
        .app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 30%, rgba(243, 186, 47, 0.03) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            padding: 4px 0 6px;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f3ba2f, #d49c1a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid rgba(243, 186, 47, 0.3);
            flex-shrink: 0;
        }
        .user-info .name {
            font-size: 16px;
            font-weight: 700;
            color: #f5e6d3;
        }
        .user-info .rank {
            font-size: 11px;
            color: #f3ba2f;
            background: rgba(243, 186, 47, 0.12);
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
        }
        .user-info .level-progress-mini {
            font-size: 10px;
            color: #8a7a54;
            margin-top: 2px;
        }
        .user-info .level-progress-mini span {
            color: #f3ba2f;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-btn {
            background: rgba(26, 22, 16, 0.6);
            border: 1px solid rgba(47, 40, 28, 0.3);
            border-radius: 30px;
            padding: 6px 12px;
            color: #f5e6d3;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-btn:active { transform: scale(0.95); }
        .header-btn .icon { font-size: 14px; }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(26, 22, 16, 0.5);
            border-radius: 16px;
            padding: 6px 14px;
            border: 1px solid rgba(47, 40, 28, 0.15);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-bottom: 4px;
        }
        .stats-bar .stat {
            text-align: center;
        }
        .stats-bar .stat .num {
            font-size: 18px;
            font-weight: 800;
            color: #f3ba2f;
        }
        .stats-bar .stat .label {
            font-size: 8px;
            color: #8a7a54;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ===== COIN ===== */
        .coin-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 1;
            perspective: 800px;
            margin: 4px 0;
        }
        .coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 2;
        }
        .coin::before {
            content: '🐹';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            background: radial-gradient(circle at 35% 30%, #f5d98a, #d49c1a 45%, #b8860b 70%, #8a6b0e 95%);
            border: 6px solid #f9d342;
            box-shadow:
                0 0 0 3px rgba(107, 79, 14, 0.4),
                0 12px 60px rgba(243, 186, 47, 0.25),
                inset 0 -10px 30px rgba(0,0,0,0.5),
                inset 0 10px 30px rgba(255,215,0,0.1);
            z-index: 1;
        }
        .coin:active { transform: scale(0.85) rotateY(8deg); }
        .coin.disabled { opacity: 0.4; pointer-events: none; }

        .coin .inner-ring {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border-radius: 50%;
            border: 2px solid rgba(255,215,0,0.08);
            z-index: 1;
            pointer-events: none;
        }

        .float-text {
            position: absolute;
            font-size: 2rem;
            font-weight: 800;
            color: #f3ba2f;
            text-shadow: 0 0 20px #f3ba2f, 0 0 40px #f3ba2f80;
            pointer-events: none;
            z-index: 10;
            animation: floatUp 0.9s ease-out forwards;
        }
        .float-text.super {
            color: #ff6b6b;
            text-shadow: 0 0 20px #ff6b6b, 0 0 40px #ff6b6b80;
            font-size: 2.8rem;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.2); }
        }

        /* ===== BOTTOM ROW ===== */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }
        .bottom-btn {
            background: rgba(26, 22, 16, 0.6);
            border: 1px solid rgba(47, 40, 28, 0.2);
            border-radius: 14px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .bottom-btn:active { transform: scale(0.95); background: rgba(47, 40, 28, 0.4); }
        .bottom-btn .icon { font-size: 20px; display: block; }
        .bottom-btn .label { font-size: 8px; color: #8a7a54; margin-top: 2px; font-weight: 600; }
        .bottom-btn .badge {
            font-size: 10px;
            color: #f3ba2f;
            font-weight: 700;
        }
        .bottom-btn .time {
            font-size: 9px;
            color: #4d3f28;
        }

        /* ===== NEWS ===== */
        .news-bar {
            background: rgba(26, 22, 16, 0.5);
            border-radius: 12px;
            padding: 6px 12px;
            border: 1px solid rgba(47, 40, 28, 0.15);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .news-bar .news-text {
            font-size: 10px;
            color: #bdaa7a;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .news-bar .news-link {
            font-size: 10px;
            color: #f3ba2f;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, rgba(20, 16, 12, 0.95), rgba(14, 11, 8, 0.95));
            border-radius: 30px;
            padding: 6px 4px;
            border: 1px solid rgba(47, 40, 28, 0.2);
            flex-shrink: 0;
            margin-top: 6px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(15px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 8px;
            color: rgba(150, 140, 120, 0.5);
            cursor: pointer;
            background: transparent;
            border: none;
            font-weight: 600;
            gap: 1px;
            transition: 0.15s;
            flex: 1;
            position: relative;
        }
        .nav-item .icon { font-size: 20px; line-height: 1; }
        .nav-item .label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.3px; }
        .nav-item.active { color: #f3ba2f; background: rgba(243, 186, 47, 0.08); }
        .nav-item:active { opacity: 0.6; }
        .nav-item .badge-dot {
            position: absolute;
            top: 2px;
            right: 6px;
            width: 6px;
            height: 6px;
            background: #ff6b6b;
            border-radius: 50%;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: linear-gradient(145deg, #1a1610, #12100d);
            border: 1px solid rgba(61, 50, 31, 0.4);
            border-radius: 24px;
            padding: 20px 18px 18px;
            max-width: 380px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }
        .modal-box .modal-close {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 20px;
            color: #8a7a54;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 8px;
        }
        .modal-box .modal-close:active { color: #f3ba2f; }
        .modal-box h2 {
            color: #f3ba2f;
            font-size: 1.2rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .modal-box .modal-body {
            color: #bdaa7a;
            font-size: 13px;
        }
        .modal-box .modal-body .item {
            background: rgba(14, 12, 7, 0.6);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(47, 40, 28, 0.3);
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-box .modal-body .item .label { color: #8a7a54; font-size: 12px; }
        .modal-box .modal-body .item .value { color: #f3ba2f; font-weight: 600; font-size: 14px; }
        .modal-box .modal-body .big-btn {
            background: linear-gradient(135deg, #f3ba2f, #d49c1a);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 15px;
            color: #0e0c07;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 0 #876a1a;
            transition: 0.08s;
            margin-top: 8px;
        }
        .modal-box .modal-body .big-btn:active { transform: translateY(4px); box-shadow: 0 0px 0 #876a1a; }
        .modal-box .modal-body .big-btn.secondary {
            background: rgba(26, 22, 16, 0.8);
            color: #f3ba2f;
            box-shadow: 0 4px 0 #1a1610;
            border: 1px solid rgba(243, 186, 47, 0.2);
        }
        .modal-box .modal-body .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0;
        }
        .modal-box .modal-body .input-group input {
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(47, 40, 28, 0.3);
            background: rgba(14, 12, 7, 0.6);
            color: #e5d6b0;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        .modal-box .modal-body .input-group input:focus { border-color: #f3ba2f; }

        /* Scrollbar */
        .modal-box::-webkit-scrollbar { width: 3px; }
        .modal-box::-webkit-scrollbar-track { background: transparent; }
        .modal-box::-webkit-scrollbar-thumb { background: #3d321f; border-radius: 10px; }

        @media (max-width: 420px) {
            .coin { width: 170px; height: 170px; }
            .coin::before { font-size: 75px; }
            .stats-bar .stat .num { font-size: 15px; }
        }
        @media (max-width: 360px) {
            .coin { width: 150px; height: 150px; }
            .coin::before { font-size: 65px; }
            .bottom-row { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="user-section">
            <div class="avatar">🐹</div>
            <div class="user-info">
                <div class="name" id="userName">CEO</div>
                <div class="rank">🥉 Bronze <span id="rankProgress">1 / 11</span></div>
                <div class="level-progress-mini">⚡ <span id="energyDisplay">1000</span> / 1000</div>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="openSkins()">🎨 <span id="skinCount">1/11</span></button>
            <button class="header-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <!-- ===== STATS BAR ===== -->
    <div class="stats-bar">
        <div class="stat">
            <div class="num" id="balanceDisplay">0</div>
            <div class="label">💰 Coins</div>
        </div>
        <div class="stat">
            <div class="num" id="hourEarnings">0</div>
            <div class="label">⚡ Per Hour</div>
        </div>
        <div class="stat">
            <div class="num" id="levelDisplay">1</div>
            <div class="label">🏆 Level</div>
        </div>
    </div>

    <!-- ===== COIN ===== -->
    <div class="coin-wrapper" id="coinWrapper">
        <div class="coin" id="mainCoin" role="button" aria-label="Tap to earn">
            <div class="inner-ring"></div>
        </div>
    </div>

    <!-- ===== BOTTOM ROW (Daily Reward, Cipher, Combo, Mini Game) ===== -->
    <div class="bottom-row">
        <div class="bottom-btn" onclick="openDailyReward()">
            <span class="icon">🎁</span>
            <span class="label">Daily reward</span>
            <span class="time" id="dailyRewardTime">11:15</span>
        </div>
        <div class="bottom-btn" onclick="openCipher()">
            <span class="icon">🔐</span>
            <span class="label">Daily cipher</span>
            <span class="time" id="cipherTime">06:15</span>
        </div>
        <div class="bottom-btn" onclick="openCombo()">
            <span class="icon">🎯</span>
            <span class="label">Daily combo</span>
            <span class="time" id="comboTime">23:15</span>
        </div>
        <div class="bottom-btn" onclick="openMiniGame()">
            <span class="icon">🎮</span>
            <span class="label">Mini game</span>
            <span class="time" id="miniGameTime">07:15</span>
        </div>
    </div>

    <!-- ===== NEWS BAR ===== -->
    <div class="news-bar">
        <span class="news-text" id="newsText">🐹 Hamster Kombat's 250 million players targeted in malware attacks</span>
        <span class="news-link" onclick="openNews()">Visit ></span>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="nav-item active" data-page="home" onclick="switchPage('home')">
            <span class="icon">🏠</span>
            <span class="label">Home</span>
        </button>
        <button class="nav-item" data-page="search" onclick="switchPage('search')">
            <span class="icon">🔍</span>
            <span class="label">Search</span>
        </button>
        <button class="nav-item" data-page="notifications" onclick="switchPage('notifications')">
            <span class="icon">🔔</span>
            <span class="label">Notifications</span>
            <span class="badge-dot"></span>
        </button>
        <button class="nav-item" data-page="activity" onclick="switchPage('activity')">
            <span class="icon">📊</span>
            <span class="label">Activity</span>
        </button>
    </div>

</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <h2 id="modalTitle">Modal</h2>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
(function() {
    "use strict";

    // ===== STATE =====
    const STORAGE_KEY = 'hamster_kombat_data';
    const MAX_ENERGY = 1000;
    const ENERGY_REGEN = 1; // per second

    let saved = (() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e) { return null; }
    })();

    let balance = saved?.balance || 0;
    let energy = saved?.energy ?? MAX_ENERGY;
    let level = saved?.level || 1;
    let tapPower = saved?.tapPower || 1;
    let lastTapTime = saved?.lastTapTime || 0;
    let skinsOwned = saved?.skinsOwned || ['🐹'];
    let currentSkin = saved?.currentSkin || 0;
    let dailyRewardClaimed = saved?.dailyRewardClaimed || false;
    let dailyRewardDate = saved?.dailyRewardDate || '';
    let comboClaimed = saved?.comboClaimed || false;
    let comboDate = saved?.comboDate || '';
    let cipherSolved = saved?.cipherSolved || false;
    let cipherDate = saved?.cipherDate || '';
    let miniGameScore = saved?.miniGameScore || 0;
    let activityLog = saved?.activityLog || ['🎮 Started playing!'];
    let notifications = saved?.notifications || [];

    // ===== DOM =====
    const balanceDisplay = document.getElementById('balanceDisplay');
    const energyDisplay = document.getElementById('energyDisplay');
    const levelDisplay = document.getElementById('levelDisplay');
    const hourEarnings = document.getElementById('hourEarnings');
    const rankProgress = document.getElementById('rankProgress');
    const skinCount = document.getElementById('skinCount');
    const coinEl = document.getElementById('mainCoin');
    const coinWrapper = document.getElementById('coinWrapper');
    const dailyRewardTime = document.getElementById('dailyRewardTime');
    const cipherTime = document.getElementById('cipherTime');
    const comboTime = document.getElementById('comboTime');
    const miniGameTime = document.getElementById('miniGameTime');
    const newsText = document.getElementById('newsText');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    // ===== FUNCTIONS =====
    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            balance, energy, level, tapPower, lastTapTime,
            skinsOwned, currentSkin,
            dailyRewardClaimed, dailyRewardDate,
            comboClaimed, comboDate,
            cipherSolved, cipherDate,
            miniGameScore, activityLog, notifications
        }));
    }

    function updateUI() {
        balanceDisplay.textContent = balance.toLocaleString();
        energyDisplay.textContent = Math.floor(energy);
        levelDisplay.textContent = level;
        rankProgress.textContent = `${level} / 11`;
        skinCount.textContent = `${skinsOwned.length}/11`;
        hourEarnings.textContent = (tapPower * 3600 / 2).toFixed(0);

        if (energy <= 0) coinEl.classList.add('disabled');
        else coinEl.classList.remove('disabled');

        // Update times
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        dailyRewardTime.textContent = `${hours}:${mins}`;
        // Show countdown to next events
        updateCountdowns();

        saveState();
    }

    function updateCountdowns() {
        const now = new Date();
        const times = [
            { el: cipherTime, target: 6, min: 15 },
            { el: comboTime, target: 23, min: 15 },
            { el: miniGameTime, target: 7, min: 15 }
        ];
        times.forEach(({ el, target, min }) => {
            let targetDate = new Date(now);
            targetDate.setHours(target, min, 0, 0);
            if (targetDate < now) targetDate.setDate(targetDate.getDate() + 1);
            const diff = targetDate - now;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        });
    }

    // ===== ENERGY REGEN =====
    function regenerateEnergy() {
        const now = Date.now();
        const diff = (now - lastTapTime) / 1000;
        const regen = diff * ENERGY_REGEN;
        if (regen > 0 && energy < MAX_ENERGY) {
            energy = Math.min(MAX_ENERGY, energy + regen);
            lastTapTime = now - (diff % 1 * 1000);
            updateUI();
        }
    }

    setInterval(() => {
        regenerateEnergy();
        updateCountdowns();
    }, 1000);

    // ===== TAP =====
    function handleTap(e) {
        e.preventDefault?.();
        regenerateEnergy();

        if (energy <= 0) {
            showTapLimit();
            return;
        }

        const amount = tapPower;
        energy -= 1;
        balance += amount;
        lastTapTime = Date.now();

        // Level up every 1000 coins
        const newLevel = Math.floor(balance / 1000) + 1;
        if (newLevel > level) {
            level = newLevel;
            addActivity(`🏆 Leveled up to ${level}!`);
            if (level % 5 === 0) {
                addNotification(`🎉 You reached level ${level}! Amazing!`);
            }
        }

        updateUI();

        // Float text
        const rect = coinEl.getBoundingClientRect();
        const wrapperRect = coinWrapper.getBoundingClientRect();
        const x = (e.clientX || rect.left + rect.width/2) - wrapperRect.left;
        const y = (e.clientY || rect.top + 10) - wrapperRect.top;
        createFloatText(x, y, amount);

        // Animation
        coinEl.style.transform = 'scale(0.85) rotateY(6deg)';
        setTimeout(() => coinEl.style.transform = '', 80);
    }

    function showTapLimit() {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = '⏳ No energy!';
        el.style.left = (coinWrapper.offsetWidth/2 - 40) + 'px';
        el.style.top = '20px';
        coinWrapper.appendChild(el);
        setTimeout(() => el.remove(), 1200);
    }

    function createFloatText(x, y, amount) {
        const el = document.createElement('div');
        el.className = 'float-text';
        el.textContent = `+${amount}`;
        el.style.left = (x - 15) + 'px';
        el.style.top = (y - 10) + 'px';
        coinWrapper.appendChild(el);
        setTimeout(() => el.remove(), 900);
    }

    // ===== COIN EVENTS =====
    coinEl.addEventListener('click', handleTap);
    coinEl.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleTap(e);
    }, { passive: false });

    // ===== FUNCTIONS FOR UI =====
    function addActivity(msg) {
        activityLog.unshift(`${new Date().toLocaleTimeString()} ${msg}`);
        if (activityLog.length > 50) activityLog.pop();
        saveState();
    }

    function addNotification(msg) {
        notifications.unshift({ msg, time: new Date().toLocaleString(), read: false });
        if (notifications.length > 30) notifications.pop();
        saveState();
    }

    // ===== MODAL =====
    function openModal(title, html) {
        modalTitle.textContent = title;
        modalBody.innerHTML = html;
        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
    }
    window.closeModal = closeModal;

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
    });

    // ===== DAILY REWARD =====
    function openDailyReward() {
        const today = new Date().toDateString();
        const claimed = dailyRewardDate === today && dailyRewardClaimed;
        const reward = 100 + level * 10;

        openModal('🎁 Daily Reward', `
            <div style="text-align:center;padding:12px 0;">
                <div style="font-size:4rem;">🎁</div>
                <div style="font-size:2rem;font-weight:800;color:#f3ba2f;">+${reward} coins</div>
                <div style="font-size:11px;color:#8a7a54;">Claim once per day</div>
                ${claimed ? `
                    <div style="background:rgba(47,40,28,0.3);padding:12px;border-radius:14px;margin:10px 0;">
                        ✅ Already claimed today!<br>
                        <span style="font-size:10px;color:#8a7a54;">Next reward in 24h</span>
                    </div>
                ` : `
                    <button class="big-btn" onclick="claimDailyReward()">🎯 Claim Now</button>
                `}
            </div>
        `);
    }
    window.openDailyReward = openDailyReward;

    function claimDailyReward() {
        const reward = 100 + level * 10;
        balance += reward;
        dailyRewardClaimed = true;
        dailyRewardDate = new Date().toDateString();
        addActivity(`🎁 Claimed daily reward: +${reward} coins`);
        updateUI();
        closeModal();
        openDailyReward();
    }
    window.claimDailyReward = claimDailyReward;

    // ===== DAILY CIPHER =====
    function openCipher() {
        const today = new Date().toDateString();
        const solved = cipherDate === today && cipherSolved;
        const code = Math.floor(1000 + Math.random() * 9000);

        openModal('🔐 Daily Cipher', `
            <div style="text-align:center;padding:6px 0;">
                <div style="font-size:3rem;">🔐</div>
                <div style="font-size:14px;color:#bdaa7a;margin:6px 0;">Enter the daily cipher code:</div>
                <div style="font-size:3rem;font-weight:800;color:#f3ba2f;background:rgba(14,12,7,0.6);padding:12px;border-radius:16px;border:1px solid rgba(47,40,28,0.3);">
                    ${code}
                </div>
                ${solved ? `
                    <div style="background:rgba(47,40,28,0.3);padding:12px;border-radius:14px;margin:10px 0;color:#4caf50;">
                        ✅ Solved today! +500 coins
                    </div>
                ` : `
                    <div class="input-group" style="margin-top:10px;">
                        <input type="text" id="cipherInput" placeholder="Enter code..." inputmode="numeric" />
                        <button class="big-btn" onclick="solveCipher(${code})">🔓 Unlock</button>
                    </div>
                `}
            </div>
        `);
        setTimeout(() => {
            const inp = document.getElementById('cipherInput');
            if (inp) inp.focus();
        }, 300);
    }
    window.openCipher = openCipher;

    function solveCipher(code) {
        const input = document.getElementById('cipherInput');
        if (!input) return;
        if (input.value.trim() === String(code)) {
            balance += 500;
            cipherSolved = true;
            cipherDate = new Date().toDateString();
            addActivity('🔐 Solved daily cipher: +500 coins');
            updateUI();
            closeModal();
            alert('✅ Correct! +500 coins!');
        } else {
            alert('❌ Wrong code. Try again!');
            openCipher();
        }
    }
    window.solveCipher = solveCipher;

    // ===== DAILY COMBO =====
    const comboPrizes = ['🟡', '🟢', '🔵'];
    const comboEmojis = ['🎯', '⭐', '💎'];

    function openCombo() {
        const today = new Date().toDateString();
        const claimed = comboDate === today && comboClaimed;

        let cardsHTML = comboPrizes.map((p, i) => `
            <div style="flex:1;text-align:center;background:rgba(14,12,7,0.6);padding:14px 6px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);">
                <div style="font-size:2.5rem;">${p}</div>
                <div style="font-size:9px;color:#8a7a54;margin-top:4px;">Card ${i+1}</div>
            </div>
        `).join('');

        openModal('🎯 Daily Combo', `
            <div style="text-align:center;padding:6px 0;">
                <div style="font-size:3rem;">🎯</div>
                <div style="font-size:14px;color:#bdaa7a;margin:6px 0;">Find the winning combo!</div>
                <div style="display:flex;gap:8px;justify-content:center;margin:10px 0;">
                    ${cardsHTML}
                </div>
                ${claimed ? `
                    <div style="background:rgba(47,40,28,0.3);padding:12px;border-radius:14px;margin:10px 0;color:#4caf50;">
                        ✅ Combo claimed! +1000 coins
                    </div>
                ` : `
                    <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
                        ${comboEmojis.map((e, i) => `
                            <button class="big-btn secondary" onclick="selectCombo(${i})" style="flex:1;min-width:60px;padding:10px;font-size:20px;">
                                ${e}
                            </button>
                        `).join('')}
                    </div>
                    <div style="font-size:10px;color:#8a7a54;margin-top:6px;">Pick the correct emoji!</div>
                `}
            </div>
        `);
    }
    window.openCombo = openCombo;

    let comboAttempts = 0;
    const MAX_COMBO_ATTEMPTS = 3;
    const comboAnswer = 1; // Index of correct answer

    function selectCombo(index) {
        if (comboAttempts >= MAX_COMBO_ATTEMPTS) {
            alert('❌ You used all attempts! Try again tomorrow.');
            return;
        }
        comboAttempts++;
        if (index === comboAnswer) {
            balance += 1000;
            comboClaimed = true;
            comboDate = new Date().toDateString();
            addActivity('🎯 Won daily combo: +1000 coins');
            updateUI();
            closeModal();
            alert('🎉 Correct! +1000 coins!');
        } else {
            const left = MAX_COMBO_ATTEMPTS - comboAttempts;
            alert(`❌ Wrong! ${left} attempts left.`);
            if (left > 0) openCombo();
            else {
                closeModal();
                alert('No more attempts. Try again tomorrow!');
            }
        }
    }
    window.selectCombo = selectCombo;

    // ===== MINI GAME =====
    function openMiniGame() {
        openModal('🎮 Mini Game', `
            <div style="text-align:center;padding:6px 0;">
                <div style="font-size:3rem;">🎮</div>
                <div style="font-size:14px;color:#bdaa7a;margin:6px 0;">Tap the hamster as fast as you can!</div>
                <div style="font-size:3rem;font-weight:800;color:#f3ba2f;" id="miniGameScore">${miniGameScore}</div>
                <div style="font-size:11px;color:#8a7a54;">Your best score</div>
                <button class="big-btn" onclick="startMiniGame()" style="margin-top:10px;">▶️ Play</button>
            </div>
        `);
    }
    window.openMiniGame = openMiniGame;

    let miniGameRunning = false;
    let miniGameTaps = 0;
    let miniGameTimer = null;

    function startMiniGame() {
        if (miniGameRunning) return;
        miniGameRunning = true;
        miniGameTaps = 0;
        let timeLeft = 10;

        openModal('🎮 Mini Game', `
            <div style="text-align:center;">
                <div style="font-size:4rem;cursor:pointer;" id="miniGameHamster" onclick="tapMiniGame()">🐹</div>
                <div style="font-size:2rem;font-weight:800;color:#f3ba2f;margin:6px 0;" id="miniGameCounter">0</div>
                <div style="font-size:14px;color:#bdaa7a;">⏱️ <span id="miniGameTimer">10</span>s</div>
                <div style="font-size:10px;color:#8a7a54;">Tap the hamster!</div>
            </div>
        `);

        miniGameTimer = setInterval(() => {
            timeLeft--;
            const timerEl = document.getElementById('miniGameTimer');
            if (timerEl) timerEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(miniGameTimer);
                miniGameRunning = false;
                if (miniGameTaps > miniGameScore) {
                    miniGameScore = miniGameTaps;
                    saveState();
                    addActivity(`🎮 New mini game record: ${miniGameTaps} taps!`);
                    alert(`🏆 New record! ${miniGameTaps} taps!`);
                } else {
                    alert(`⏱️ Time up! ${miniGameTaps} taps.`);
                }
                closeModal();
                openMiniGame();
            }
        }, 1000);
    }
    window.startMiniGame = startMiniGame;

    function tapMiniGame() {
        if (!miniGameRunning) return;
        miniGameTaps++;
        const counter = document.getElementById('miniGameCounter');
        if (counter) counter.textContent = miniGameTaps;
        // Add tap effect
        const hamster = document.getElementById('miniGameHamster');
        if (hamster) {
            hamster.style.transform = 'scale(0.8)';
            setTimeout(() => hamster.style.transform = '', 100);
        }
    }
    window.tapMiniGame = tapMiniGame;

    // ===== SKINS =====
    const allSkins = ['🐹', '🦊', '🐼', '🐨', '🦁', '🐯', '🐮', '🐷', '🐸', '🐵', '🦄'];

    function openSkins() {
        let html = `<div style="text-align:center;padding:6px 0;">
            <div style="font-size:2rem;">🎨 Skins</div>
            <div style="font-size:12px;color:#8a7a54;">${skinsOwned.length} / 11 owned</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;">`;

        allSkins.forEach((skin, i) => {
            const owned = skinsOwned.includes(skin);
            const isCurrent = i === currentSkin;
            html += `
                <div style="background:${owned ? 'rgba(47,40,28,0.3)' : 'rgba(14,12,7,0.6)'};border-radius:12px;padding:10px;border:${isCurrent ? '2px solid #f3ba2f' : '1px solid rgba(47,40,28,0.3)'};">
                    <div style="font-size:2.5rem;">${skin}</div>
                    <div style="font-size:8px;color:#8a7a54;margin-top:4px;">
                        ${owned ? (isCurrent ? '✅ Active' : '<button onclick="selectSkin('+i+')" style="background:none;border:none;color:#f3ba2f;cursor:pointer;font-size:10px;">Select</button>') : '<button onclick="buySkin('+i+')" style="background:none;border:none;color:#f3ba2f;cursor:pointer;font-size:10px;">Buy 500</button>'}
                    </div>
                </div>
            `;
        });

        html += `</div></div>`;
        openModal('🎨 Skins', html);
    }
    window.openSkins = openSkins;

    function buySkin(index) {
        const skin = allSkins[index];
        if (skinsOwned.includes(skin)) return;
        if (balance < 500) {
            alert('❌ Need 500 coins!');
            return;
        }
        balance -= 500;
        skinsOwned.push(skin);
        addActivity(`🎨 Bought skin: ${skin}`);
        updateUI();
        openSkins();
    }
    window.buySkin = buySkin;

    function selectSkin(index) {
        const skin = allSkins[index];
        if (!skinsOwned.includes(skin)) return;
        currentSkin = index;
        // Update coin emoji
        const coinEl = document.querySelector('.coin::before');
        // For simplicity we update the style via pseudo-element not possible, so we'll use a different approach
        // Instead, update the text content of the coin via a span
        const coin = document.querySelector('.coin');
        coin.style.setProperty('--skin-emoji', `'${skin}'`);
        // Actually we need a different approach - let's just store and show on tap
        addActivity(`🎨 Selected skin: ${skin}`);
        updateUI();
        openSkins();
    }
    window.selectSkin = selectSkin;

    // ===== NEWS =====
    function openNews() {
        openModal('📰 News', `
            <div style="padding:6px 0;">
                <div style="background:rgba(14,12,7,0.6);padding:12px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);margin:4px 0;">
                    <div style="font-size:14px;font-weight:600;color:#f5e6d3;">🐹 Hamster Kombat's 250 million players targeted in malware attacks</div>
                    <div style="font-size:11px;color:#8a7a54;margin-top:6px;">Security researchers have identified a new wave of malware targeting Hamster Kombat players. Stay safe!</div>
                    <div style="font-size:10px;color:#4d3f28;margin-top:6px;">🔗 Read more on our blog</div>
                </div>
                <div style="background:rgba(14,12,7,0.6);padding:12px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);margin:4px 0;">
                    <div style="font-size:14px;font-weight:600;color:#f5e6d3;">🎉 New Season Coming Soon!</div>
                    <div style="font-size:11px;color:#8a7a54;margin-top:6px;">Season 2 brings new skins, mini-games, and bigger rewards.</div>
                </div>
                <div style="background:rgba(14,12,7,0.6);padding:12px;border-radius:12px;border:1px solid rgba(47,40,28,0.3);margin:4px 0;">
                    <div style="font-size:14px;font-weight:600;color:#f5e6d3;">💰 Airdrop Event Live!</div>
                    <div style="font-size:11px;color:#8a7a54;margin-top:6px;">Connect your wallet to participate in the $HMSTR airdrop.</div>
                </div>
            </div>
        `);
    }
    window.openNews = openNews;

    // ===== NOTIFICATIONS =====
    function switchPage(page) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const btn = document.querySelector(`.nav-item[data-page="${page}"]`);
        if (btn) btn.classList.add('active');

        if (page === 'notifications') {
            openModal('🔔 Notifications', `
                <div style="padding:4px 0;">
                    ${notifications.length === 0 ? '<p style="color:#8a7a54;text-align:center;">No notifications</p>' :
                    notifications.map(n => `
                        <div style="background:rgba(14,12,7,0.6);padding:10px 14px;border-radius:10px;border:1px solid rgba(47,40,28,0.2);margin:4px 0;">
                            <div style="font-size:13px;color:#f5e6d3;">${n.msg}</div>
                            <div style="font-size:9px;color:#4d3f28;">${n.time}</div>
                        </div>
                    `).join('')}
                </div>
            `);
            // Mark as read
            notifications.forEach(n => n.read = true);
            saveState();
        } else if (page === 'activity') {
            openModal('📊 Activity', `
                <div style="padding:4px 0;">
                    ${activityLog.length === 0 ? '<p style="color:#8a7a54;text-align:center;">No activity yet</p>' :
                    activityLog.map(a => `
                        <div style="background:rgba(14,12,7,0.6);padding:8px 12px;border-radius:8px;border:1px solid rgba(47,40,28,0.15);margin:3px 0;font-size:12px;color:#bdaa7a;">
                            ${a}
                        </div>
                    `).join('')}
                </div>
            `);
        } else if (page === 'search') {
            openModal('🔍 Search', `
                <div style="padding:6px 0;text-align:center;">
                    <div style="font-size:3rem;">🔍</div>
                    <p style="color:#8a7a54;margin:6px 0;">Search for players, clans, and more</p>
                    <div class="input-group">
                        <input type="text" placeholder="Search..." />
                        <button class="big-btn secondary">Search</button>
                    </div>
                </div>
            `);
        }
    }
    window.switchPage = switchPage;

    // ===== SETTINGS =====
    function openSettings() {
        openModal('⚙️ Settings', `
            <div style="padding:6px 0;">
                <div class="item">
                    <span class="label">💰 Balance</span>
                    <span class="value">${balance.toLocaleString()}</span>
                </div>
                <div class="item">
                    <span class="label">🏆 Level</span>
                    <span class="value">${level}</span>
                </div>
                <div class="item">
                    <span class="label">⚡ Tap Power</span>
                    <span class="value">+${tapPower}</span>
                </div>
                <div class="item">
                    <span class="label">🎨 Skins Owned</span>
                    <span class="value">${skinsOwned.length}/11</span>
                </div>
                <button class="big-btn secondary" onclick="resetGame()" style="margin-top:10px;color:#ff6b6b;">🔄 Reset Game</button>
            </div>
        `);
    }
    window.openSettings = openSettings;

    function resetGame() {
        if (confirm('⚠️ Are you sure? This will delete all progress!')) {
            if (confirm('Really? All coins, levels, and skins will be lost!')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
    }
    window.resetGame = resetGame;

    // ===== INIT =====
    updateUI();

    // Add welcome notification
    if (!saved) {
        addNotification('🐹 Welcome to Hamster Kombat!');
        addActivity('🐹 Started playing!');
    }

    console.log('🐹 Hamster Kombat loaded!');
    console.log('💰 Balance:', balance);
    console.log('⚡ Energy:', energy);
    console.log('🏆 Level:', level);
    console.log('🎨 Skins:', skinsOwned.length);

})();
</script>
</body>
</html>
