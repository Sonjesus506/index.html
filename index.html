<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>🟡 BNB CPU Miner</title>
    <style>
        /* ----- RESET & ROOT ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #f7e05e;
            --primary-dark: #f9b84a;
            --bg-main: #0a121c;
            --bg-card: #0d1b28;
            --text-light: #d6edff;
            --text-muted: #6a8aa8;
            --border-color: #1e3447;
            --shadow-color: rgba(247, 224, 94, 0.3);
            --green: #4ae09a;
            --red: #ff4757;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #080e17;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ----- MAIN APP CONTAINER (FULL HEIGHT) ----- */
        .app-container {
            max-width: 440px;
            width: 100%;
            height: 100vh;
            /* fills entire mobile screen */
            max-height: 820px;
            /* optional cap for very tall screens */
            background: radial-gradient(circle at 30% 10%, #182a3a, #0a121c);
            border-radius: 48px 48px 28px 28px;
            padding: 20px 14px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 215, 0, 0.08) inset;
            border: 1px solid rgba(255, 215, 0, 0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* makes children stack and allows flex-grow */
            transition: all 0.3s ease;
        }

        /* ----- TOP BAR (pushed higher) ----- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            /* reduced from 6px to push higher */
            padding: 0 2px;
            flex-shrink: 0;
        }

        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar .brand .logo {
            font-size: 1.2rem;
        }

        .top-bar .brand .title {
            color: var(--primary);
            font-weight: 800;
            font-size: 0.85rem;
            /* slightly bigger */
        }

        .top-bar .badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #0a121c;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 800;
            display: inline-block;
        }

        /* ----- SETTINGS ICON (separate, top-right) ----- */
        .settings-icon {
            background: rgba(8, 20, 32, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 1.1rem;
            cursor: pointer;
            color: var(--text-light);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .settings-icon:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .settings-icon .gear {
            font-size: 1.2rem;
        }

        /* ----- NAVIGATION TABS (below top bar) ----- */
        .nav-tabs {
            display: flex;
            background: #0d1822;
            border-radius: 60px;
            padding: 4px;
            margin-bottom: 8px;
            /* reduced to bring content up */
            border: 1px solid var(--border-color);
            overflow-x: auto;
            gap: 2px;
            flex-shrink: 0;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.6rem;
            /* slightly bigger */
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            background: transparent;
            letter-spacing: 0.3px;
            white-space: nowrap;
            min-width: 35px;
        }

        .nav-tab.active {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #0a121c;
            box-shadow: 0 4px 20px var(--shadow-color);
        }

        .nav-tab:active {
            transform: scale(0.96);
        }

        /* ----- SCREENS (flex‑grow to fill remaining height) ----- */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
            /* fills remaining vertical space */
            animation: fadeSlide 0.3s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- HOME SCREEN (stretches to bottom) ----- */
        .home-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
            /* pushes content apart */
            gap: 4px;
        }

        /* ----- MARKET PRICE (smaller, less space) ----- */
        .market-price {
            background: rgba(8, 20, 32, 0.5);
            border-radius: 40px;
            padding: 4px 14px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .market-price .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-light);
        }

        .market-price .change {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .market-price .change.up {
            color: var(--green);
            background: rgba(74, 224, 154, 0.15);
        }

        .market-price .change.down {
            color: var(--red);
            background: rgba(255, 71, 87, 0.15);
        }

        .market-price .label {
            font-size: 0.45rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ----- MINER VISUAL (bigger icons) ----- */
        .miner-visual {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0 4px;
            flex-shrink: 0;
        }

        .bnb-logo {
            font-size: 3.2rem;
            /* larger */
            margin-bottom: 0px;
            text-shadow: 0 0 40px var(--shadow-color);
        }

        .fan-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fan-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            box-shadow: 0 0 30px var(--shadow-color), inset 0 0 30px var(--shadow-color);
            background: rgba(8, 24, 40, 0.4);
        }

        .fan-blades {
            position: relative;
            width: 100px;
            height: 100px;
            animation: spinFan 2s linear infinite;
            animation-play-state: paused;
        }

        .fan-blades.spinning {
            animation-play-state: running;
        }

        @keyframes spinFan {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .blade {
            position: absolute;
            width: 32px;
            /* wider */
            height: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 20px;
            top: 50%;
            left: 50%;
            transform-origin: 0 50%;
            box-shadow: 0 0 15px var(--shadow-color);
        }

        .blade:nth-child(1) {
            transform: rotate(0deg) translateX(16px);
        }
        .blade:nth-child(2) {
            transform: rotate(72deg) translateX(16px);
        }
        .blade:nth-child(3) {
            transform: rotate(144deg) translateX(16px);
        }
        .blade:nth-child(4) {
            transform: rotate(216deg) translateX(16px);
        }
        .blade:nth-child(5) {
            transform: rotate(288deg) translateX(16px);
        }

        .fan-center {
            position: absolute;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary), var(--primary-dark));
            box-shadow: 0 0 30px var(--shadow-color);
            border: 2px solid var(--primary);
            z-index: 2;
        }

        .miner-label {
            color: var(--primary);
            font-size: 0.7rem;
            /* bigger */
            margin-top: 2px;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        /* ----- STATS ROW (bigger font) ----- */
        .stats-row {
            display: flex;
            justify-content: space-around;
            background: rgba(8, 20, 32, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            margin: 2px 0 4px;
            flex-shrink: 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .label {
            font-size: 0.55rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-item .value {
            font-weight: 700;
            font-size: 1rem;
            /* bigger */
            color: var(--text-light);
        }

        .stat-item .value.bnb-gold {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ----- BALANCE (bigger) ----- */
        .balance-big {
            text-align: center;
            margin: 4px 0 6px;
            flex-shrink: 0;
        }

        .balance-big .coin {
            font-size: 2.6rem;
            /* bigger */
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .balance-big .label {
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        .balance-big .sub-label {
            font-size: 0.5rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ----- STATUS PILL ----- */
        .status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #0e1a24;
            padding: 5px 12px;
            border-radius: 60px;
            margin: 2px 0 6px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3d5a6e;
            transition: 0.2s;
        }

        .dot.active {
            background: #3fe07a;
            box-shadow: 0 0 20px #3fe07a;
        }

        .status-label {
            font-weight: 600;
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .session-time {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        /* ----- BUTTONS ----- */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 12px 8px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #1d2f3f;
            color: var(--text-light);
            box-shadow: 0 4px 0 #0a141e, 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.06s ease;
            cursor: pointer;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0a141e;
        }

        .btn-primary {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #0a121c;
            border: 1px solid var(--primary);
            text-shadow: none;
        }

        .btn-success {
            background: linear-gradient(145deg, #2fb86a, #167a42);
            color: white;
            border: 1px solid #6ae09a;
        }

        /* ----- OFFLINE BADGE ----- */
        .offline-badge {
            margin-top: 6px;
            padding: 6px 12px;
            background: rgba(74, 224, 154, 0.05);
            border: 1px solid rgba(74, 224, 154, 0.2);
            border-radius: 40px;
            text-align: center;
            font-size: 0.6rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .offline-badge span {
            color: var(--green);
        }

        /* ----- OTHER SCREENS (Boost, Social, etc.) ----- */
        /* We keep them minimal; they will also flex‑grow if needed */
        .screen-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 6px;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 420px) {
            .app-container {
                padding: 12px 8px 16px;
                max-height: 100vh;
                border-radius: 28px 28px 16px 16px;
            }

            .balance-big .coin {
                font-size: 2.2rem;
            }

            .fan-container {
                width: 100px;
                height: 100px;
            }
            .fan-ring {
                width: 100px;
                height: 100px;
            }
            .fan-blades {
                width: 80px;
                height: 80px;
            }
            .blade {
                width: 26px;
                height: 8px;
            }
            .blade:nth-child(1) {
                transform: rotate(0deg) translateX(13px);
            }
            .blade:nth-child(2) {
                transform: rotate(72deg) translateX(13px);
            }
            .blade:nth-child(3) {
                transform: rotate(144deg) translateX(13px);
            }
            .blade:nth-child(4) {
                transform: rotate(216deg) translateX(13px);
            }
            .blade:nth-child(5) {
                transform: rotate(288deg) translateX(13px);
            }

            .nav-tab {
                font-size: 0.5rem;
                padding: 6px 2px;
                min-width: 28px;
            }

            .stats-row .stat-item .value {
                font-size: 0.85rem;
            }

            .top-bar .brand .title {
                font-size: 0.75rem;
            }
        }

        /* Additional screens (Boost, Social, Invite, Withdraw, Profile, AI) */
        /* These will inherit the flex layout from .screen */
        .boost-header h2 {
            color: var(--primary);
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 6px;
        }

        .cpu-box {
            background: rgba(8, 20, 32, 0.6);
            border-radius: 28px;
            padding: 14px;
            border: 2px solid var(--border-color);
            margin-bottom: 6px;
            position: relative;
        }

        /* etc. — keep it simple, the main layout is now flex‑based */
        /* All existing styles for other screens remain but we ensure they flex‑grow */
        .screen>.screen-content,
        .screen>div:not(.nav-tabs) {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Quick fix for other screen contents */
        .screen#screen-boost .boost-header,
        .screen#screen-social .social-header,
        .screen#screen-invite .invite-header,
        .screen#screen-withdraw .withdraw-card,
        .screen#screen-profile .profile-header,
        .screen#screen-ai .ai-chat {
            flex-shrink: 0;
        }

        .screen#screen-boost .cpu-box {
            flex: 1;
        }

        /* (Keep all your existing styles for other components below) */
        /* ... your existing CSS for boost levels, social items, etc. ... */

        /* For brevity, we assume the rest of your styles are unchanged */
        /* But we override the container to use flex column */
        .app-container {
            display: flex;
            flex-direction: column;
        }

        /* Ensure .screen fills remaining space */
        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* Home screen inner wrapper */
        #screen-home {
            justify-content: flex-start;
        }

        /* The home content should stretch */
        .home-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Keep all your other styles (Boost, Social, etc.) */
        /* ... they remain unchanged ... */

        /* Make sure the settings icon is clickable and visible */
        .settings-icon {
            cursor: pointer;
            user-select: none;
        }

        .settings-icon:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">

        <!-- ===== TOP BAR (pushed higher) ===== -->
        <div class="top-bar">
            <div class="brand">
                <span class="logo">🟡</span>
                <span class="title" id="appTitle">BNB CPU</span>
            </div>
            <div class="settings-icon" id="settingsIcon" title="Settings">
                <span class="gear">⚙️</span>
                <span style="font-size:0.6rem; font-weight:600;">Settings</span>
            </div>
            <span class="badge" id="appBadge">⚡ PERSISTENT</span>
        </div>

        <!-- ===== NAVIGATION TABS ===== -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-screen="home" id="navHome">🏠</button>

            <button class="nav-tab" data-screen="invite" id="navInvite">👥</button>
            <button class="nav-tab" data-screen="withdraw" id="navWithdraw">💸</button>
            <button class="nav-tab" data-screen="profile" id="navProfile">⚙️</button>
            <button class="nav-tab" data-screen="ai" id="navAi">🤖</button>
        </div>

        <!-- ===== HOME SCREEN (stretches to bottom) ===== -->
        <div class="screen active" id="screen-home">
            <div class="home-content">

                <!-- Market Price -->
                <div class="market-price">
                    <div>
                        <div class="label" id="marketLabel">BNB / USD</div>
                        <div class="price" id="bnbPrice">$580.00</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="change up" id="bnbChange">+2.5%</div>
                        <div class="label" id="volumeLabel">Vol: 2.4M</div>
                    </div>
                </div>

                <!-- Miner Visual (bigger icons) -->
                <div class="miner-visual">
                    <div class="bnb-logo">🟡</div>
                    <div class="fan-container">
                        <div class="fan-ring"></div>
                        <div class="fan-blades" id="fanBlades">
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                            <div class="blade"></div>
                        </div>
                        <div class="fan-center"></div>
                    </div>
                    <div class="miner-label" id="minerLabel">⚡ BNB CPU MINER</div>
                </div>

                <!-- Stats Row (bigger font) -->
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="label" id="statSpeed">⚡ Speed</div>
                        <div class="value bnb-gold" id="homeSpeed">0.00000010</div>
                    </div>
                    <div class="stat-item">
                        <div class="label" id="statMined">⏳ Mined</div>
                        <div class="value" id="homeMined">0.00000000</div>
                    </div>
                    <div class="stat-item">
                        <div class="label" id="statStatus">Status</div>
                        <div class="value" id="homeStatus" style="font-size:0.7rem; color:var(--text-muted);">Idle</div>
                    </div>
                </div>

                <!-- Balance (bigger) -->
                <div class="balance-big">
                    <div class="label" id="balanceLabel">💰 BNB BALANCE</div>
                    <div class="coin" id="homeBalance">0.00000000</div>
                    <div class="sub-label">≈ $<span id="usdValue">0.00</span> USD</div>
                    <div class="sub-label" style="font-size:0.4rem; color:var(--text-muted);" id="lastMined">Last mined: Just now</div>
                </div>

                <!-- Status Pill -->
                <div class="status-pill">
                    <span class="dot" id="statusDot"></span>
                    <span class="status-label" id="statusLabel">⏸️ Stopped</span>
                    <span class="session-time" id="sessionTime">00:00</span>
                </div>

                <!-- Start/Stop Button -->
                <button class="btn btn-primary" id="toggleMineBtn">
                    <span>▶</span> <span id="startBtnText">START MINING</span>
                </button>

                <!-- Offline Badge -->
                <div class="offline-badge">⛏️ <span>Always mining</span> · Even when offline</div>

            </div>
        </div>

        <!-- ===== OTHER SCREENS (Boost, Social, etc.) ===== -->
        <!-- They will use the same flex layout automatically -->
        <!-- For brevity, we keep the rest of your HTML unchanged -->

        <!-- TOAST CONTAINER -->
        <div id="toastContainer" style="min-height:36px; margin-top:4px;"></div>

    </div>

            function t(key) {
                const lang = LANGUAGES[currentLang] || LANGUAGES.en;
                return lang[key] || LANGUAGES.en[key] || key;
            }

            // ==================== HELPERS ====================
            function fmt(v) { return Number(v).toFixed(8); }

            function fmtShort(v) { return Number(v).toFixed(4); }

            function showToast(msg, isSuccess) {
                const container = $('toastContainer');
                if (!container) return;
                container.innerHTML = `<div class="toast ${isSuccess ? 'success' : ''}">${msg}</div>`;
                if (window.toastTimeout) clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => { container.innerHTML = ''; }, 5000);
            }

            function getTotalSpeed() {
                const levelSpeed = boostLevel > 0 ? LEVELS[boostLevel - 1].speed : BASE_SPEED;
                return levelSpeed + inviteBonusSpeed + socialBonusSpeed;
            }

            function getSocialCount() {
                let count = 0;
                for (const key in socialConnected)
                    if (socialConnected[key]) count++;
                return count;
            }

            function getSocialBonus() {
                const count = getSocialCount();
                if (count >= 6) return 0.00000100;
                if (count >= 3) return 0.00000030;
                if (count >= 1) return 0.00000010;
                return 0;
            }

            // ==================== SAVE/LOAD ====================
            function saveGame() {
                try {
                    localStorage.setItem('bnb_miner_data', JSON.stringify({
                        balance,
                        totalMined,
                        boostLevel,
                        inviteCount,
                        inviteBonusSpeed,
                        socialConnected,
                        socialEarnings,
                        groups,
                        friends,
                        userName,
                        currentLang,
                        lastSave: Date.now()
                    }));
                } catch (e) {}
            }

            function loadGame() {
                try {
                    const data = localStorage.getItem('bnb_miner_data');
                    if (data) {
                        const parsed = JSON.parse(data);
                        balance = parsed.balance || 0;
                        totalMined = parsed.totalMined || 0;
                        boostLevel = parsed.boostLevel || 0;
                        inviteCount = parsed.inviteCount || 0;
                        inviteBonusSpeed = parsed.inviteBonusSpeed || 0;
                        socialConnected = parsed.socialConnected || socialConnected;
                        socialEarnings = parsed.socialEarnings || 0;
                        groups = parsed.groups || groups;
                        friends = parsed.friends || friends;
                        userName = parsed.userName || 'BNB Miner';
                        currentLang = parsed.currentLang || 'en';
                        return parsed.lastSave || Date.now();
                    }
                } catch (e) {}
                return null;
            }

            function calculateOfflineMining() {
                const lastSave = loadGame();
                if (lastSave) {
                    const diff = (Date.now() - lastSave) / 1000;
                    if (diff > 3) {
                        const speed = getTotalSpeed();
                        const mined = speed * diff;
                        if (mined > 0.00000001) {
                            balance += mined;
                            totalMined += mined;
                            const msg = t('toastMined')
                                .replace('{amount}', fmt(mined))
                                .replace('{seconds}', Math.floor(diff));
                            showToast(msg, true);
                            return mined;
                        }
                    }
                }
                return 0;
            }

            // ==================== UI UPDATE ====================
            function updateUI() {
                const speed = getTotalSpeed();
                const usd = balance * bnbPrice;

                const homeBalance = $('homeBalance');
                if (homeBalance) homeBalance.textContent = fmt(balance);
                const homeSpeed = $('homeSpeed');
                if (homeSpeed) homeSpeed.textContent = fmt(speed);
                const homeMined = $('homeMined');
                if (homeMined) homeMined.textContent = fmt(totalMined);
                const usdValue = $('usdValue');
                if (usdValue) usdValue.textContent = usd.toFixed(2);
                const homeStatus = $('homeStatus');
                if (homeStatus) homeStatus.textContent = isMining ? 'Active' : 'Idle';

                const dot = $('statusDot');
                if (dot) {
                    if (isMining) dot.classList.add('active');
                    else dot.classList.remove('active');
                }

                const statusLabel = $('statusLabel');
                if (statusLabel) statusLabel.textContent = isMining ? t('statusMining') : t('statusLabel');

                const startBtnText = $('startBtnText');
                if (startBtnText) startBtnText.textContent = isMining ? t('stopBtnText') : t('startBtnText');

                const toggleBtn = $('toggleMineBtn');
                if (toggleBtn) {
                    toggleBtn.className = isMining ? 'btn btn-success' : 'btn btn-primary';
                }

                const fan = $('fanBlades');
                if (fan) {
                    if (isMining) fan.classList.add('spinning');
                    else fan.classList.remove('spinning');
                }

                // Update market
                const bnbPriceEl = $('bnbPrice');
                if (bnbPriceEl) bnbPriceEl.textContent = `$${bnbPrice.toFixed(2)}`;
                const bnbChangeEl = $('bnbChange');
                if (bnbChangeEl) {
                    bnbChangeEl.textContent = `${bnbChange > 0 ? '+' : ''}${bnbChange.toFixed(1)}%`;
                    bnbChangeEl.className = `change ${bnbChange >= 0 ? 'up' : 'down'}`;
                }
                const volumeLabel = $('volumeLabel');
                if (volumeLabel) volumeLabel.textContent = `${t('volumeLabel')} ${bnbVolume.toFixed(1)}M`;
            }

            // ==================== MINING ====================
            function mineTick() {
                if (!isMining) return;
                const speed = getTotalSpeed();
                balance += speed;
                totalMined += speed;
                if (socialBonusSpeed > 0) socialEarnings += socialBonusSpeed;
                updateUI();
                saveGame();
            }

            function toggleMining() {
                if (isMining) {
                    isMining = false;
                    if (miningInterval) { clearInterval(miningInterval);
                        miningInterval = null; }
                    if (sessionInterval) { clearInterval(sessionInterval);
                        sessionInterval = null; }
                    showToast(t('toastStop'));
                    saveGame();
                } else {
                    isMining = true;
                    sessionSeconds = 0;
                    const sessionTime = $('sessionTime');
                    if (sessionTime) sessionTime.textContent = '00:00';
                    miningInterval = setInterval(mineTick, 1000);
                    sessionInterval = setInterval(() => {
                        sessionSeconds++;
                        const m = String(Math.floor(sessionSeconds / 60)).padStart(2, '0');
                        const s = String(sessionSeconds % 60).padStart(2, '0');
                        const st = $('sessionTime');
                        if (st) st.textContent = `${m}:${s}`;
                    }, 1000);
                    showToast(t('toastStart'), true);
                    saveGame();
                }
                updateUI();
            }

            // ==================== MARKET ====================
            function updateMarket() {
                const change = (Math.random() - 0.48) * 4;
                bnbChange = parseFloat((bnbChange + change * 0.1).toFixed(1));
                if (bnbChange > 15) bnbChange = 15;
                if (bnbChange < -15) bnbChange = -15;
                const pc = (bnbChange / 100) * bnbPrice * (Math.random() * 0.5 + 0.5);
                bnbPrice = parseFloat((bnbPrice + pc).toFixed(2));
                if (bnbPrice < 300) bnbPrice = 300;
                if (bnbPrice > 900) bnbPrice = 900;
                bnbVolume = parseFloat((bnbVolume + (Math.random() - 0.5) * 0.3).toFixed(1));
                if (bnbVolume < 0.5) bnbVolume = 0.5;
                if (bnbVolume > 8) bnbVolume = 8;
                updateUI();
            }

            // ==================== LANGUAGE ====================
            function translateAll() {
                const keys = [
                    'appTitle', 'appBadge', 'marketLabel', 'volumeLabel', 'navHome', 'navBoost', 'navSocial',
                    'navInvite', 'navWithdraw', 'navProfile', 'navAi', 'minerLabel', 'statSpeed', 'statMined',
                    'statStatus', 'balanceLabel', 'boostTitle', 'machineLabel', 'cpuSpeedLabel', 'cpuPerSecLabel',
                    'cpuLevelLabel', 'upgradeLabel', 'levelsLabel', 'socialTitle', 'socialEarnLabel', 'connectText',
                    'socialRewardTitle', 'reward1', 'reward2', 'reward3', 'groupsTitle', 'createBtnText', 'joinText',
                    'inviteTitle', 'inviteTotalLabel', 'inviteBonusLabel', 'inviteCodeLabel', 'copyBtnText',
                    'inviteRewardTitle', 'inviteReward1', 'inviteReward2', 'withdrawTitle', 'countryLabel',
                    'paymentLabel', 'walletLabel', 'amountLabel', 'minNotice', 'submitBtnText', 'feeInfo',
                    'feeYou', 'feeBNB', 'availableLabel', 'levelLabel', 'xpLabel', 'editHint', 'langTitle',
                    'langLabel', 'themeTitle', 'colorLabel', 'statsTitle', 'statTotalMined', 'statMiningSpeed',
                    'statInvites', 'statBoost', 'statSocial', 'friendsTitle', 'yourFriendsLabel', 'addFriendText',
                    'aiTitle', 'aiStatus', 'sendBtnText', 'modalTitle', 'modalPlaceholder', 'modalCancel', 'modalSave',
                    'connectedText', 'joinedText', 'levelOwned', 'levelBuy', 'levelLocked'
                ];

                keys.forEach(key => {
                    const el = $(key);
                    if (el) {
                        if (key === 'minerLabel' || key === 'balanceLabel' || key === 'boostTitle' ||
                            key === 'socialTitle' || key === 'inviteTitle' || key === 'withdrawTitle' ||
                            key === 'langTitle' || key === 'themeTitle' || key === 'statsTitle' ||
                            key === 'friendsTitle' || key === 'aiTitle') {
                            el.textContent = t(key);
                        } else if (key === 'minNotice') {
                            el.innerHTML = `⚠️ ${t(key)}`;
                        } else if (key === 'feeInfo') {
                            el.innerHTML =
                                `💼 <strong>${t(key).replace('💼 ', '')}</strong>
                            <div style="display:flex; justify-content:space-around; margin-top:2px; font-size:0.45rem;">
                                <span id="feeYou">${t('feeYou')}</span>
                                <span id="feeBNB">${t('feeBNB')}</span>
                            </div>
                            <span style="font-size:0.45rem;">${t('availableLabel')}: <span id="withdrawBalance" style="color:var(--primary);">${fmt(balance)}</span> BNB</span>`;
                        } else if (key === 'modalPlaceholder') {
                            el.placeholder = t(key);
                        } else if (key === 'withdrawTitle') {
                            el.innerHTML =
                                `💸 ${t(key).replace('💸 ', '')} <span class="badge" id="countryBadge">🌍 Auto</span>`;
                        } else {
                            el.textContent = t(key);
                        }
                    }
                });

                // Update status
                const statusLabel = $('statusLabel');
                if (statusLabel) statusLabel.textContent = isMining ? t('statusMining') : t('statusLabel');
                const startBtnText = $('startBtnText');
                if (startBtnText) startBtnText.textContent = isMining ? t('stopBtnText') : t('startBtnText');
                const toggleBtn = $('toggleMineBtn');
                if (toggleBtn) toggleBtn.className = isMining ? 'btn btn-success' : 'btn btn-primary';

                // Update connect buttons
                qsa('.c-text').forEach(el => el.textContent = t('connectText'));
                // Update join buttons
                qsa('.j-text').forEach(el => el.textContent = t('joinText'));

                updateUI();
            }

            // ==================== COUNTRY ====================
            function updateCountry() {
                const select = $('countrySelect');
                if (!select) return;
                const val = select.value;
                const parts = val.split('|');
                const code = parts[0];
                const pref = parts[1];
                const flag = parts[2] || '🌍';
                const flagEl = $('countryFlag');
                if (flagEl) flagEl.textContent = flag;
                const prefixEl = $('countryPrefix');
                if (prefixEl) prefixEl.textContent = pref;
                const badgeEl = $('countryBadge');
                if (badgeEl) badgeEl.textContent = `${flag} ${code}`;
                const userCountry = $('userCountry');
                if (userCountry) userCountry.textContent = `${flag} ${code}`;
            }

            function detectCountry() {
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const map = {
                    'Africa/Dar_es_Salaam': 'TZ|+255|🇹🇿',
                    'Africa/Nairobi': 'KE|+254|🇰🇪',
                    'Africa/Kampala': 'UG|+256|🇺🇬',
                    'Africa/Lagos': 'NG|+234|🇳🇬',
                    'Africa/Johannesburg': 'ZA|+27|🇿🇦',
                    'Africa/Cairo': 'EG|+20|🇪🇬',
                    'Africa/Accra': 'GH|+233|🇬🇭',
                    'Asia/Kolkata': 'IN|+91|🇮🇳',
                    'Asia/Shanghai': 'CN|+86|🇨🇳',
                    'Asia/Tokyo': 'JP|+81|🇯🇵',
                    'Asia/Seoul': 'KR|+82|🇰🇷',
                    'Asia/Singapore': 'SG|+65|🇸🇬',
                    'Asia/Bangkok': 'TH|+66|🇹🇭',
                    'Asia/Jakarta': 'ID|+62|🇮🇩',
                    'Asia/Manila': 'PH|+63|🇵🇭',
                    'Europe/London': 'GB|+44|🇬🇧',
                    'America/New_York': 'US|+1|🇺🇸',
                    'America/Toronto': 'CA|+1|🇨🇦',
                    'Australia/Sydney': 'AU|+61|🇦🇺',
                    'Asia/Dubai': 'AE|+971|🇦🇪'
                };
                let detected = 'TZ|+255|🇹🇿';
                for (const [tz, val] of Object.entries(map)) {
                    if (timezone.includes(tz)) { detected = val; break; }
                }
                const select = $('countrySelect');
                if (select) select.value = detected;
                updateCountry();
            }

            // ==================== THEME ====================
            function setTheme(color) {
                const app = document.getElementById('app');
                if (app) {
                    app.style.setProperty('--primary', color);
                    app.style.setProperty('--primary-dark', color);
                    app.style.setProperty('--shadow-color', color + '40');
                }
            }

            // ==================== INIT ====================
            function init() {
                // Load saved data
                const lastSave = loadGame();
                if (lastSave) calculateOfflineMining();

                // Set language
                const langSelect = $('languageSelect');
                if (langSelect) langSelect.value = currentLang;

                // Set invite code
                const inviteCode = $('inviteCode');
                if (inviteCode) inviteCode.textContent = REFERRAL_CODE;
                const inviteLink = $('inviteLinkInput');
                if (inviteLink) inviteLink.value = `https://t.me/BNBMinerBot?start=${REFERRAL_CODE}`;

                // Translate
                translateAll();

                // Detect country
                detectCountry();

                // Update UI
                updateUI();

                // Show welcome
                setTimeout(() => {
                    showToast(t('toastWelcome'), true);
                }, 600);

                // Auto-save
                setInterval(saveGame, 10000);

                // Market
                setInterval(updateMarket, 5000);
                updateMarket();

                // Settings icon click - navigate to profile
                const settingsIcon = $('settingsIcon');
                if (settingsIcon) {
                    settingsIcon.addEventListener('click', function() {
                        // Navigate to profile tab
                        const profileTab = $('navProfile');
                        if (profileTab) profileTab.click();
                    });
                }
            }

            // ==================== EVENT LISTENERS ====================
            document.addEventListener('DOMContentLoaded', function() {
                // Toggle mining
                const toggleBtn = $('toggleMineBtn');
                if (toggleBtn) toggleBtn.addEventListener('click', toggleMining);

                // Navigation
                const navBtns = qsa('.nav-tab');
                const screens = {
                    home: 'screen-home',
                    boost: 'screen-boost',
                    social: 'screen-social',
                    invite: 'screen-invite',
                    withdraw: 'screen-withdraw',
                    profile: 'screen-profile',
                    ai: 'screen-ai'
                };
                navBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        navBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        const screen = this.dataset.screen;
                        Object.keys(screens).forEach(key => {
                            const el = $(screens[key]);
                            if (el) el.classList.toggle('active', key === screen);
                        });
                        updateUI();
                    });
                });

                // Language
                const langSelect = $('languageSelect');
                if (langSelect) {
                    langSelect.addEventListener('change', function() {
                        currentLang = this.value;
                        translateAll();
                        updateUI();
                        const names = {
                            'en': 'English',
                            'sw': 'Kiswahili',
                            'fr': 'Français',
                            'es': 'Español',
                            'pt': 'Português',
                            'de': 'Deutsch',
                            'it': 'Italiano',
                            'ru': 'Русский',
                            'zh': '中文',
                            'ar': 'العربية',
                            'hi': 'हिन्दी',
                            'id': 'Indonesia'
                        };
                        showToast(t('toastLanguage').replace('{lang}', names[currentLang] || currentLang), true);
                        saveGame();
                    });
                }

                // Country
                const countrySelect = $('countrySelect');
                if (countrySelect) {
                    countrySelect.addEventListener('change', updateCountry);
                }

                // Theme
                qsa('.theme-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const color = this.dataset.color;
                        setTheme(color);
                        const picker = $('themeColorPicker');
                        if (picker) picker.value = color;
                    });
                });
                const colorPicker = $('themeColorPicker');
                if (colorPicker) {
                    colorPicker.addEventListener('input', function() {
                        setTheme(this.value);
                    });
                }

                // Init
                init();
            });

        })();
    </script>
